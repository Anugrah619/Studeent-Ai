      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSubjectBreakdownList'
          description: ''
  /api/students/{id}/topic-states/:
    get:
      operationId: students_topic_states_list
      description: |-
        This student's per-chapter mastery, weakest first.

        Ordered by `mastery` ascending; Postgres sorts NULLs last on an
        ascending sort, so chapters with too little evidence to score sit
        at the end rather than masquerading as the weakest ones. With
        `?forgetting=true`, ordered by `retention` ascending instead.
      parameters:
      - in: query
        name: forgetting
        schema:
          type: boolean
        description: 'Only chapters whose forecast `retention` is below 0.5, ordered
          by `retention` ascending — the chapters being forgotten fastest come first.
          Chapters never seen have a null retention and are excluded. Combines with
          `weak`. A presence filter: any value other than `true` is ignored.'
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this student.
        required: true
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: weak
        schema:
          type: boolean
        description: Only chapters with a measured `mastery` below 0.5. Chapters below
          the evidence floor carry a null mastery and are excluded, because 'not enough
          attempts to say' is not the same claim as 'weak'.
      tags:
      - students
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTopicStateList'
          description: ''
components:
  schemas:
    AnswerTypeEnum:
      enum:
      - mcq
      - numerical
      type: string
      description: |-
        * `mcq` - Multiple choice
        * `numerical` - Numerical value
    AskAnswer:
      type: object
      properties:
        answer:
          type: string
          description: At most about 120 words, safe to show verbatim.
        available:
          type: boolean
          description: Always true on a 200. When no answer can be given the response
            is a 503.
        from_cache:
          type: boolean
          description: True if this exact question over the same data was answered
            before.
      required:
      - answer
      - available
      - from_cache
    AskRequest:
      type: object
      properties:
        question:
          type: string
          minLength: 1
          description: A preparation question, at most 500 characters — 'what should
            I focus on this week?', 'why is Thermodynamics in my plan?'. Names, roll
            numbers, the mentor's and institute's names, phone numbers and emails
            are removed before it is sent anywhere.
          maxLength: 500
      required:
      - question
    Attempt:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        question_id:
          type: string
          maxLength: 100
        topic_name:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/StatusEnum'
        time_spent:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        marks:
          type: number
          format: double
        source:
          $ref: '#/components/schemas/SourceEnum'
        ts:
          type: string
          format: date-time
      required:
      - id
      - question_id
      - status
      - topic_name
      - ts
    Batch:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        exam_code:
          type: string
          readOnly: true
        year:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        exam_date:
          type: string
          format: date
          nullable: true
        student_count:
          type: integer
          readOnly: true
          nullable: true
          description: Students in this batch. Null when the batch is embedded in
            another payload (e.g. `StudentDetail.batch`), where it is not computed.
      required:
      - exam_code
      - id
      - name
      - student_count
      - year
    BlankEnum:
      enum:
      - ''
    BlueprintReport:
      type: object
      properties:
        dry_run:
          type: boolean
        ok:
          type: boolean
          description: No errors; a real run would apply this file.
        paper_id:
          type: integer
        questions_in_file:
          type: integer
        expected_questions:
          type: integer
          description: '`total_questions` on the paper. Fewer in the file is a warning,
            not an error.'
        created:
          type: integer
        updated:
          type: integer
        unchanged:
          type: integer
        errors_total:
          type: integer
        errors:
          type: array
          items:
            $ref: '#/components/schemas/IngestRowError'
          description: At most the first 100.
      required:
      - created
      - dry_run
      - errors
      - errors_total
      - expected_questions
      - ok
      - paper_id
      - questions_in_file
      - unchanged
      - updated
    BlueprintUploadRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: 'CSV or Excel `.xlsx` (first sheet): question_id, chapter,
            correct_option (or answer for a numeric question). Legacy `.xls` is refused
            with how to re-save it.'
        dry_run:
          type: boolean
          default: false
          description: Check the file and report what would happen without saving
            anything.
      required:
      - file
    CauseEnum:
      enum:
      - conceptual_gap
      - execution_error
      - time_exhaustion
      - avoidable_skip
      - insufficient_evidence
      type: string
      description: |-
        * `conceptual_gap` - conceptual_gap
        * `execution_error` - execution_error
        * `time_exhaustion` - time_exhaustion
        * `avoidable_skip` - avoidable_skip
        * `insufficient_evidence` - insufficient_evidence
    ColumnMappingProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        mapping:
          type: object
          additionalProperties:
            enum:
            - answer
            - batch
            - ignore
            - question_id
            - roll_no
            - time_spent
            type: string
            description: |-
              * `answer` - answer
              * `batch` - batch
              * `ignore` - ignore
              * `question_id` - question_id
              * `roll_no` - roll_no
              * `time_spent` - time_spent
          description: '`{the column''s name in the file: the field it holds}`.'
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - mapping
      - name
    ColumnMappingProfileRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        mapping:
          type: object
          additionalProperties:
            enum:
            - answer
            - batch
            - ignore
            - question_id
            - roll_no
            - time_spent
            type: string
            description: |-
              * `answer` - answer
              * `batch` - batch
              * `ignore` - ignore
              * `question_id` - question_id
              * `roll_no` - roll_no
              * `time_spent` - time_spent
          description: '`{the column''s name in the file: the field it holds}`.'
      required:
      - mapping
      - name
    ConfidenceEnum:
      enum:
      - high
      - medium
      - low
      type: string
      description: |-
        * `high` - high
        * `medium` - medium
        * `low` - low
    ConfidenceRating:
      type: object
      description: |-
        How strong the student *thinks* they are in one chapter.

        Compared against measured mastery to find overconfidence (see
        `TopicState.confidence_gap`), so the value has to be the student's own
        honest answer *now*. That is why there is no `ts` on the request: the
        server stamps it. The feature store takes the latest rating by `ts`, so a
        client that could send its own timestamp could pin a rating for ever by
        dating it in the future.
      properties:
        id:
          type: integer
          readOnly: true
        topic:
          type: integer
        topic_name:
          type: string
          readOnly: true
        self_rating:
          type: integer
          maximum: 5
          minimum: 1
          description: 1 = not confident at all, 5 = fully confident.
        ts:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - self_rating
      - topic
      - topic_name
      - ts
    ConfidenceRatingRequest:
      type: object
      description: |-
        How strong the student *thinks* they are in one chapter.

        Compared against measured mastery to find overconfidence (see
        `TopicState.confidence_gap`), so the value has to be the student's own
        honest answer *now*. That is why there is no `ts` on the request: the
        server stamps it. The feature store takes the latest rating by `ts`, so a
        client that could send its own timestamp could pin a rating for ever by
        dating it in the future.
      properties:
        topic:
          type: integer
        self_rating:
          type: integer
          maximum: 5
          minimum: 1
          description: 1 = not confident at all, 5 = fully confident.
      required:
      - self_rating
      - topic
    DashboardSummary:
      type: object
      description: |-
        Director's KPI strip.

        Two fields here changed *meaning* in v0.2 and the frontend must know:

        `batch_mock_avg` was a SUM of every mark every student ever scored on
        every paper, labelled as an average. It is now the mean total per
        student on the latest paper — which is what the label always claimed,
        and is also 12x cheaper because it stops reading the institute's
        entire history on every dashboard load.

        `revision_debt_pct` divided a sum of per-student debts by a student
        count and called the result a percentage; it could exceed 100 freely.
        It is now the genuine share of scheduled revisions that are overdue.
        The old quantity survives as `avg_revision_debt`, correctly named.
      properties:
        batch_id:
          type: integer
          nullable: true
          description: The batch every KPI below is scoped to, echoed back from `?batch=`.
            Null means the whole institute. It is echoed rather than assumed so a
            console can tell 'the server honoured my filter' from 'the server ignored
            it' — which is exactly the state this endpoint was in before `?batch=`
            existed.
        batch_name:
          type: string
          nullable: true
          description: Display name for `batch_id`. Null when unscoped.
        total_students:
          type: integer
        active_students:
          type: integer
        flagged_this_week:
          type: integer
        critical_flags:
          type: integer
        batch_mock_avg:
          type: number
          format: double
          nullable: true
          description: Mean total marks per student on the most recent paper — out
            of `latest_paper_max_marks`, over `latest_paper_students` sitters. Null
            when nobody in scope sat it, which is the honest answer rather than 0.
        latest_paper_id:
          type: integer
          nullable: true
          description: 'The institute''s most recent paper by `held_on`. Stays institute-wide
            even under `?batch=`: the batch narrows who is counted, not which paper
            is reported.'
        latest_paper_name:
          type: string
          nullable: true
        latest_paper_held_on:
          type: string
          format: date
          nullable: true
        latest_paper_max_marks:
          type: integer
          nullable: true
          description: The denominator for `batch_mock_avg`.
        latest_paper_students:
          type: integer
          description: How many students in scope sat the paper `batch_mock_avg` is
            computed over. 0 with a non-null `latest_paper_id` means this batch did
            not sit the institute's latest mock.
        revision_debt_pct:
          type: number
          format: double
          description: Share of scheduled revisions now past due and not done.
        avg_revision_debt:
          type: number
          format: double
          description: Mean overdue revision cycles per student.
        flags_resolved:
          type: integer
        recovery_rate_pct:
          type: number
          format: double
          nullable: true
          description: Share of closed flags whose outcome was 'recovered'.
        last_refreshed_at:
          type: string
          format: date-time
          nullable: true
          description: When the nightly refresh (features, revisions, flags, plans)
            last finished successfully for this institute — how fresh the numbers
            on this strip are. Institute-wide even under `?batch=`. Null when it has
            never run, which means everything here comes from manual or on-event updates
            only.
      required:
      - active_students
      - avg_revision_debt
      - batch_id
      - batch_mock_avg
      - batch_name
      - critical_flags
      - flagged_this_week
      - flags_resolved
      - last_refreshed_at
      - latest_paper_held_on
      - latest_paper_id
      - latest_paper_max_marks
      - latest_paper_name
      - latest_paper_students
      - recovery_rate_pct
      - revision_debt_pct
      - total_students
    Detail:
      type: object
      description: The one-key error/ack envelope DRF already uses everywhere.
      properties:
        detail:
          type: string
      required:
      - detail
    Diagnosis:
      type: object
      description: |-
        The output of `diagnose_misconception` — the product's core claim.

        `pattern_found=False` is a real and useful answer. Scattered carelessness
        is a different problem from a systematic misconception and needs a
        different response, so the model is allowed to say so rather than being
        pushed into inventing a pattern.
      properties:
        paper_id:
          type: integer
          nullable: true
          description: |-
            The paper this diagnosis is about, echoed back from `?paper=` so the payload says what it is about instead of the client having to remember what it asked for — which is also what makes it safe to cache under its own key.

            Null means the diagnosis spans **every paper this student has sat**, which is what omitting `?paper=` asks for. Null is not 'unknown'.
        paper_name:
          type: string
          nullable: true
          description: Display name for `paper_id`. Null when the diagnosis spans
            all papers.
        headline:
          type: string
        pattern_found:
          type: boolean
        hypotheses:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosisHypothesis'
        total_marks_at_stake:
          type: integer
          description: |-
            Marks the whole diagnosis accounts for, computed server-side as `MARKS_PER_WRONG x` the number of **distinct** questions cited across all hypotheses.

            **Hypotheses cannot overlap, so this is a clean total.** A student picks one option per question, and one option carries at most one misconception, so a wrong answer is evidence for exactly one finding. (Six of the forty tagged questions do *offer* two different misconceptions across their distractors — but only the one the student actually chose can fire.) The de-duplication above therefore guards against the model citing the same question twice rather than against real overlap, and on every trace recorded so far it has removed nothing.

            **It will still differ from the number in `headline`, and that is not a contradiction.** The headline quotes the cost of the *leading* hypothesis; this is the cost of all of them. A card showing both should label this one as the total across findings.

            It is also generally **less** than the marks the paper lost in total: wrong answers on untagged distractors, skips and unreached questions are all real losses that a misconception diagnosis has nothing to say about. For the full partition of a paper's lost marks use `/api/students/{id}/marks-lost/`.
        recommended_action:
          type: string
        time_to_fix:
          allOf:
          - $ref: '#/components/schemas/TimeToFixEnum'
          description: |-
            How much teaching time this costs, as one of four bands. Bounded rather than free text because the model, asked for minutes, returned 40 / 20 / 45 for the same student and the same evidence while its recommended action stayed stable — false precision on a genuinely fuzzy judgement. minutes = a correction at the board · one_session = one focused sitting · several_sessions = a few sittings over a week or two · term_long = a foundational gap needing sustained work. The client supplies the display label.

            * `minutes` - minutes
            * `one_session` - one_session
            * `several_sessions` - several_sessions
            * `term_long` - term_long
        student_ref:
          type: string
          description: The pseudonym the model was sent in place of the student's
            name (`S-{id}`). Echoed so the privacy claim can be read off the response
            — this is the only identity the model ever saw — instead of restated by
            the client.
        tally:
          $ref: '#/components/schemas/DiagnosisTally'
        trace_id:
          type: integer
          description: Feed back agreement/disagreement against this id.
        from_cache:
          type: boolean
          description: True if replayed rather than freshly generated.
        human_verdict:
          allOf:
          - $ref: '#/components/schemas/HumanVerdictEnum'
          description: |-
            What a mentor has said about this diagnosis. **`unreviewed` is a value, not an absence**: nobody has answered yet, which is not the same as having disagreed. A client that treats any non-`agreed` string as a disagreement tells a teacher who never answered that they did.

            * `agreed` - agreed
            * `disagreed` - disagreed
            * `unreviewed` - unreviewed
      required:
      - from_cache
      - headline
      - human_verdict
      - hypotheses
      - paper_id
      - paper_name
      - pattern_found
      - recommended_action
      - student_ref
      - tally
      - time_to_fix
      - total_marks_at_stake
      - trace_id
    DiagnosisEvidence:
      type: object
      description: |-
        One cited question, resolved so the console can actually open it.

        `evidence_questions` carries bare labels like `"D16"`, and a label is
        unique only *within one paper* — there is no URL a client can build
        from it. That is why this exists: the server resolves every citation
        against the student's own attempts and hands back the id that
        `GET /api/questions/{id}/` answers on.
      properties:
        question_id:
          type: integer
          nullable: true
          description: |-
            `QuestionTopicMap.id` — pass it straight to `GET /api/questions/{id}/?student={student_id}` to get the stem, the options, which one is correct, which one this student chose and what that choice indicates. It is the same value as `QuestionDetail.id` on that endpoint.

            **Null means the citation did not resolve**: the model named a question that is not a wrong answer this student gave on this paper, or the paper carries no mapped question by that label. Render those as plain text, never as a link to nowhere — a chip that opens an empty panel is worse than a chip that visibly is not one.
        label:
          type: string
          description: The question as the paper prints it — `"D16"`. What the chip
            shows, and the same string as `QuestionDetail.label`.
        chose:
          type: string
          description: The option letter this student actually picked, e.g. `"C"`.
            Blank when the citation did not resolve.
        marks_at_stake:
          type: integer
          description: 'What this one question cost: 5 — the 4 marks forgone plus
            the 1-mark penalty. 0 when the citation did not resolve, because no marks
            can be claimed for a question we cannot tie to an answer.'
      required:
      - chose
      - label
      - marks_at_stake
      - question_id
    DiagnosisHypothesis:
      type: object
      description: One candidate explanation, with the questions it rests on.
      properties:
        misconception_code:
          type: string
        claim:
          type: string
        confidence:
          $ref: '#/components/schemas/ConfidenceEnum'
        evidence_questions:
          type: array
          items:
            type: string
          description: The labels the model cited, verbatim. **Display only.** It
            is kept because it is what the model wrote, but it cannot be linked from
            — use `evidence` instead, which is the same list with each label resolved
            to a routable id.
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosisEvidence'
          description: '`evidence_questions`, resolved. One entry per cited label,
            in the order the model gave them.'
        counter_evidence_questions:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosisEvidence'
          description: |-
            The questions `counter_evidence` names, resolved — the correct answers the argument leans on, now linkable. Until this existed the strongest line on the card was the one line that could not open the question behind it.

            Found by matching whole labels in the sentence against the counter-evidence candidates **the server derived** for this misconception, so a label the model invented is never offered. `marks_at_stake` is 0 on every entry: these are questions the student got right. Empty when the sentence names none.
        counter_evidence:
          type: string
          description: |-
            The correct answers that narrow this finding — the strongest thing on the card, because it is what separates 'weak at this chapter' from 'fails only when the condition is implicit'.

            **Never blank and never null.** The prompt already tells the model to say plainly that there is no counter-evidence on this paper when there is none; the server now guarantees it. If the model returns nothing, one of two sentences is substituted — 'no counter-evidence on this paper, the weakness may be chapter-wide' when none was available to it, or 'the model did not state the counter-evidence, treat this finding as un-narrowed' when some was. The second is deliberately not disguised as the first: they are different claims and only one of them is good news.
        marks_at_stake:
          type: integer
          description: |-
            `5 x` the number of citations in `evidence` that resolved. **Counted server-side, not taken from the model** — the model is asked for judgement, not arithmetic, and this is the arithmetic. Sum `evidence[].marks_at_stake` to check it.

            Only the model's own figure survives if *no* citation resolved, in which case there is nothing better to offer and `evidence` will show why.
      required:
      - claim
      - confidence
      - counter_evidence
      - counter_evidence_questions
      - evidence
      - evidence_questions
      - marks_at_stake
      - misconception_code
    DiagnosisTally:
      type: object
      description: |-
        The counting done in code before the model was asked anything.

        Step two of the pipeline is "we count, exactly": tagged wrong options are
        tallied deterministically and the model reasons over the result. This is
        that tally for **every** wrong answer on the paper, not just the ones the
        diagnosis cites, so a reader can hold the model's story against the
        arithmetic it was given.
      properties:
        answered:
          type: integer
          description: Questions with a recorded choice.
        wrong:
          type: integer
        wrong_with_known_cause:
          type: integer
          description: Wrong answers whose chosen option carries a misconception tag.
            The rest are wrong for a reason the taxonomy has not described — real
            losses, and nothing a diagnosis can say about.
        by_misconception:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosisTallyRow'
          description: Largest cost first.
      required:
      - answered
      - by_misconception
      - wrong
      - wrong_with_known_cause
    DiagnosisTallyRow:
      type: object
      properties:
        misconception_code:
          type: string
        wrong_answers:
          type: integer
          description: Wrong answers whose chosen option is tagged with this misconception.
        marks:
          type: integer
          description: What those cost, at the diagnosis's per-wrong rate.
      required:
      - marks
      - misconception_code
      - wrong_answers
    DiagnosisVerdictRequest:
      type: object
      description: |-
        A mentor agreeing or disagreeing. This is what creates training data.

        Raw model output is a guess. The same output with a teacher's verdict
        attached is a labelled example — and a corpus of those is the thing a
        competitor cannot obtain by buying an API key.
      properties:
        verdict:
          $ref: '#/components/schemas/VerdictEnum'
        note:
          type: string
      required:
      - verdict
    DifficultyEnum:
      enum:
      - easy
      - medium
      - hard
      type: string
      description: |-
        * `easy` - Easy
        * `medium` - Medium
        * `hard` - Hard
    DisagreementOption:
      type: object
      properties:
        label:
          type: string
        text:
          type: string
        is_correct:
          type: boolean
          description: Correct according to the official key.
      required:
      - is_correct
      - label
      - text
    DisagreementReviewRequest:
      type: object
      properties:
        decision:
          allOf:
          - $ref: '#/components/schemas/KeyReviewDecisionEnum'
          description: |-
            `key_stands`: the official key is right (the key becomes trusted). `key_wrong`: the key as stored is wrong — usually a misread question (the key becomes untrusted and its options cannot be tagged). `unclear`: needs a subject expert (still untrusted, no longer unreviewed).

            * `key_stands` - The official key stands
            * `key_wrong` - The key as stored is wrong
            * `unclear` - Unclear — needs a subject expert
        note:
          type: string
          default: ''
          description: Why. Kept with the decision and in its history.
          maxLength: 2000
      required:
      - decision
    DraftMisconception:
      type: object
      description: A proposed misconception for one option. **Not a tag** — diagnosis
        ignores it.
      properties:
        code:
          type: string
          description: The code proposed — an existing taxonomy code, or a new one
            the model invented. Blank for a proposal made in the console, which names
            a belief rather than a code.
        name:
          type: string
        description:
          type: string
          description: The wrong belief, in the student's voice.
        is_new:
          type: boolean
          description: True when the proposal is not (yet) in the taxonomy.
        proposed_by:
          $ref: '#/components/schemas/ProposedByEnum'
        status:
          allOf:
          - $ref: '#/components/schemas/DraftMisconceptionStatusEnum'
          description: |-
            `draft` until a person tags the option; then `accepted` if they used this draft's code, `superseded` if they chose another.

            * `draft` - Proposed, not yet acted on
            * `accepted` - A person tagged the option with this code
            * `superseded` - A person tagged the option with a different code
      required:
      - code
      - description
      - is_new
      - name
      - proposed_by
      - status
    DraftMisconceptionProposalRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: A short name for the belief.
          maxLength: 120
        description:
          type: string
          minLength: 1
          description: The wrong belief, stated as the student would hold it.
          maxLength: 2000
      required:
      - description
      - name
    DraftMisconceptionStatusEnum:
      enum:
      - draft
      - accepted
      - superseded
      type: string
      description: |-
        * `draft` - Proposed, not yet acted on
        * `accepted` - A person tagged the option with this code
        * `superseded` - A person tagged the option with a different code
    Finding:
      type: object
      description: |-
        A diagnosis the student's mentor agreed with, in the student's words.

        **Only `agreed` diagnoses appear.** Unreviewed and disagreed ones never
        reach the student app. No misconception code, risk score or flag is
        included; the wording is the model's rewording of the approved finding
        (`reworded: true`) or a fixed template built from it when the model is
        unavailable (`reworded: false`).
      properties:
        paper_id:
          type: integer
          nullable: true
          description: The paper this finding is about — the `paper_id` of `GET /api/my/mock-scores/`.
            Null when the diagnosis spanned every paper the student had sat, or its
            paper no longer exists.
        paper_name:
          type: string
          nullable: true
          description: Null when the finding spans several papers.
        title:
          type: string
          description: Plain words, encouraging, at most about 12 words.
        explanation:
          type: string
          description: Two or three sentences, addressed to 'you'.
        what_to_do:
          type: string
          description: One concrete next step the student can take.
        questions:
          type: array
          items:
            $ref: '#/components/schemas/FindingQuestion'
          description: The questions the finding rests on, in the order cited.
        approved_at:
          type: string
          format: date-time
          nullable: true
          description: When the mentor agreed. Null only for an agreement recorded
            before the time was kept.
        reworded:
          type: boolean
          description: True if the wording is the model's rewording for students;
            false if it is the fixed template, used while the model is unavailable.
      required:
      - approved_at
      - explanation
      - paper_id
      - paper_name
      - questions
      - reworded
      - title
      - what_to_do
    FindingQuestion:
      type: object
      properties:
        question_pk:
          type: integer
          description: Opens with `GET /api/my/questions/{id}/`. Only questions this
            student answered are ever listed, so the link always opens.
        label:
          type: string
          description: The question as the paper prints it, e.g. `"Q16"`.
      required:
      - label
      - question_pk
    Flag:
      type: object
      description: |-
        One detector output, evidenced and routable.

        Filterable by `?open=`, `?severity=`, `?student=` and `?mentor=`;
        ordered by `raised_at` descending.
      properties:
        id:
          type: integer
          readOnly: true
        student_id:
          type: integer
          readOnly: true
        student_name:
          type: string
          readOnly: true
        batch_name:
          type: string
          readOnly: true
        mentor_name:
          type: string
          readOnly: true
        topic_name:
          type: string
          readOnly: true
        type:
          type: string
          description: 'Detector identifier — `weak_topic`, `over_attempting`, `plateau`,
            `subject_imbalance`, `confidence_mismatch`, `revision_overdue`, `disengagement`,
            `overload`, `mock_decline`. Open-ended on purpose: detectors are added
            without a migration, so a client must render an unknown type rather than
            assume a closed set.'
          maxLength: 40
        severity:
          allOf:
          - $ref: '#/components/schemas/SeverityEnum'
          description: |-
            How hard this flag argues for attention. **Graded per detector, not from `risk_score`** — the two answer different questions, and a student can carry a critical flag on one chapter while scoring low overall risk.

            Each detector states its own cut-offs in the units it measures, so they are comparable within a type and only roughly comparable across types. The shape is consistent:
            - `critical` — act this week. e.g. `subject_imbalance` at >= 50 marks *and* >= 10% of the paper at stake; `plateau` at a 30-point gap; `disengagement` at 14 silent days.
            - `high` — act this cycle. The same measures at roughly two-thirds of the critical cut-off (30 marks / 6%, 24 points, 7 silent days).
            - `watch` — the rule fired but below those bars. Evidence, not an instruction.
            - `improving` — the condition is resolving on its own. Deliberately not silence: a mentor should see that what they did worked.

            `evidence` carries whatever that detector measured, and `rule_version` is what lets the grading be re-derived after the thresholds change.

            * `watch` - Watch
            * `high` - High
            * `critical` - Critical
            * `improving` - Improving
        headline:
          type: string
          maxLength: 300
        evidence:
          description: What this detector measured, in its own keys. Shape varies
            by `type` — it is what answers 'why was this flagged?' six months later,
            read together with `rule_version`.
        rule_version:
          type: string
          maxLength: 20
        raised_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
        outcome:
          oneOf:
          - $ref: '#/components/schemas/FlagOutcomeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        is_open:
          type: boolean
          readOnly: true
          description: '`resolved_at is null`. The same set `?open=true` returns.'
      required:
      - batch_name
      - headline
      - id
      - is_open
      - mentor_name
      - raised_at
      - severity
      - student_id
      - student_name
      - topic_name
      - type
    FlagOutcomeEnum:
      enum:
      - recovered
      - declined
      - unknown
      type: string
      description: |-
        * `recovered` - Recovered
        * `declined` - Declined
        * `unknown` - Unknown
    FlagResolveOutcomeEnum:
      enum:
      - recovered
      - declined
      - unknown
      type: string
      description: |-
        * `recovered` - recovered
        * `declined` - declined
        * `unknown` - unknown
    FlagResolveRequest:
      type: object
      description: |-
        Closing a flag. `outcome` is required, on purpose.

        Every resolved flag is a labelled training example for the eventual
        risk model — "given this student's state in month 3, did they recover?"
        Defaulting the field would fill that dataset with polite blanks, so the
        mentor has to say which way it went. `declined` is a perfectly good
        answer and more useful than silence.
      properties:
        outcome:
          allOf:
          - $ref: '#/components/schemas/FlagResolveOutcomeEnum'
          description: |-
            What actually became of the student. Required.

            * `recovered` - recovered
            * `declined` - declined
            * `unknown` - unknown
        note:
          type: string
          description: Optional. If given, also logged as an Intervention.
      required:
      - outcome
    Guidance:
      type: object
      properties:
        next_actions:
          type: array
          items:
            $ref: '#/components/schemas/NextAction'
          description: At most five, most useful first. Empty is a real answer.
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
          description: One per paper, newest approval first. Empty until a mentor
            agrees.
      required:
      - findings
      - next_actions
    GuidanceActionKindEnum:
      enum:
      - start_plan
      - make_plan
      - revisions_due
      - mock_recoverable
      - weak_chapter
      - log_study
      - rate_confidence
      type: string
      description: |-
        * `start_plan` - Today's plan is ready and not started
        * `make_plan` - No plan for today yet
        * `revisions_due` - Revisions due or overdue
        * `mock_recoverable` - Marks on the latest mock that needed no new learning
