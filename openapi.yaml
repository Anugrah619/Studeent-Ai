    KeyDisagreement:
      type: object
      description: One question where the factory's blind answer and the official
        key differ.
      properties:
        id:
          type: integer
          description: '`QuestionTopicMap.id` — the `question_pk` the review POST
            takes.'
        paper_id:
          type: integer
        paper_name:
          type: string
        label:
          type: string
        subject:
          type: string
          nullable: true
        answer_type:
          $ref: '#/components/schemas/AnswerTypeEnum'
        question_text:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/DisagreementOption'
        official_answer:
          type: string
          description: 'NTA''s key, mapped to this paper''s labels: `2`, `1,2`, `225`.'
        model_answer:
          type: string
          description: What the model got solving blind. Never the answer.
        has_diagram:
          type: boolean
        verification:
          description: |-
            Trust in this question's answer key. `agreed`: the factory's blind solve matched the official key. `disagreed`: it did not, and nobody has reviewed it. `key_stands` / `key_wrong` / `key_unclear`: a person's decision on a disagreement. `unverifiable`: could not be checked. Blank: never cross-checked — an institute's own or a demo paper, whose key is its author's. Trusted keys: blank, `agreed`, `key_stands`.

            * `` - Not cross-checked
            * `agreed` - Model agreed with the official key
            * `disagreed` - Model disagreed — needs a person
            * `unverifiable` - Could not be checked (e.g. unreadable figure)
            * `key_stands` - Model disagreed; a person confirmed the key
            * `key_wrong` - Model disagreed; a person found the key wrong
            * `key_unclear` - Model disagreed; a person could not settle it
          oneOf:
          - $ref: '#/components/schemas/VerificationEnum'
          - $ref: '#/components/schemas/BlankEnum'
        detail_summary:
          type: string
          description: '`verification_detail` in one paragraph: the model''s answer
            and confidence, its note, transcription issues, and the factory agent''s
            first look — labelled as not a human review.'
        model_working:
          type: string
          description: The model's blind working, truncated to 1,500 characters.
        review:
          $ref: '#/components/schemas/KeyReview'
      required:
      - answer_type
      - detail_summary
      - has_diagram
      - id
      - label
      - model_answer
      - model_working
      - official_answer
      - options
      - paper_id
      - paper_name
      - question_text
      - review
      - subject
      - verification
    KeyReview:
