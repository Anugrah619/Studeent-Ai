      required:
      - code
      - name
    MockScore:
      type: object
      description: |-
        One paper's marks, split by subject.

        `subjects` is **additive** and is the field to read: one entry per
        subject of the student's syllabus, in syllabus order, present on every
        row (0 when the paper had none of that subject). `physics`, `chemistry`
        and `maths` are kept unchanged for clients written before it, and are 0
        for an exam without that subject — a NEET row has `maths: 0` and its
        Biology only in `subjects`.
      properties:
        paper_id:
          type: integer
        paper_name:
          type: string
        held_on:
          type: string
          format: date
        physics:
          type: number
          format: double
          description: Legacy. The Physics entry of `subjects`, or 0.
        chemistry:
          type: number
          format: double
          description: Legacy. The Chemistry entry of `subjects`, or 0.
        maths:
          type: number
          format: double
          description: Legacy. The Maths (or Mathematics) entry of `subjects`, or
            0 — always 0 for NEET.
        total:
          type: number
          format: double
          description: The sum of `subjects[].marks` — every subject, not only the
            legacy three.
        subjects:
          type: array
          items:
            $ref: '#/components/schemas/MockScoreSubject'
          description: Additive. One entry per subject of the student's syllabus,
            in syllabus order, on every row; a subject the student has marks in that
            their current syllabus lacks is appended after.
      required:
      - chemistry
      - held_on
      - maths
      - paper_id
      - paper_name
      - physics
      - subjects
      - total
    MockScoreSubject:
      type: object
      properties:
        subject:
          type: string
          description: The subject's name as the syllabus tree spells it.
        marks:
          type: number
          format: double
