openapi: 3.0.3
info:
  title: Student AI API
  version: 0.1.0
  description: Contract between the Django backend and the React console / student
    PWA. This schema is the source of truth — regenerate with `manage.py spectacular
    --file ../openapi.yaml` after any serializer change.
paths:
  /api/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: Sets the `csrftoken` cookie. Call once before POSTing to login.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Exchange credentials for a session cookie.

        `authentication_classes` is empty on purpose: DRF's
        `SessionAuthentication` enforces CSRF on the *authenticated* path, and
        running it here would have it inspect a session that does not exist
        yet. Django's `CsrfViewMiddleware` still protects this POST.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: End the session. POST only — a GET logout is a CSRF vector.
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/password/:
    post:
      operationId: auth_password_create
      description: |-
        Replace my password. For a new student this is the end of first sign-in.

        Needs the current password even though the caller is signed in: a
        session left open on a shared phone should not be enough to take over
        the account. On success the session survives (the hash that ties a
        session to a password is refreshed) and `must_change_password` clears, so
        the same tab carries straight on into the app.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/batches/:
    get:
      operationId: batches_list
      description: |-
        The institute's batches, each with its live student count.

        Ordered by name (`Batch.Meta.ordering`). This is the source for the
        console's batch filter, which feeds `?batch=` on `/api/students/` and
        on `/api/dashboard/summary/`.
      parameters:
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - batches
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBatchList'
          description: ''
  /api/batches/{id}/:
    get:
      operationId: batches_retrieve
      description: |-
        The institute's batches, each with its live student count.

        Ordered by name (`Batch.Meta.ordering`). This is the source for the
        console's batch filter, which feeds `?batch=` on `/api/students/` and
        on `/api/dashboard/summary/`.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this batch.
        required: true
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      tags:
      - batches
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
          description: ''
  /api/dashboard/summary/:
    get:
      operationId: dashboard_summary_retrieve
      description: |-
        The director's KPI strip. Three things were wrong with it.

        **① It read the institute's entire attempt history.** The old
        `batch_mock_avg` query was `filter(test_paper__isnull=False)` with
        an `order_by` that the aggregate discarded, so Postgres did a Seq
        Scan over every attempt ever recorded — 24,000 rows and 343
        buffers on the seed, and O(history) on the most-visited page in
        the product. At the design's volume (45k attempts per institute
        per month) that is a multi-second query on every dashboard load.

        No index fixes it, because the query genuinely wanted every row.
        Asking for one paper instead is what fixes it.

        **Re-measured, because the number in the handoff was for a
        different query.** Three warm runs of each, `EXPLAIN (ANALYZE,
        BUFFERS)` against the seeded 24,000 attempts:

        ```
        old  Seq Scan, 24000 rows, SUM only          343 buffers  3.56 ms
        new  Index Scan, 3300 rows, SUM + COUNT(DISTINCT student_id)
                                                      52 buffers  1.14 ms
        new  Index Scan, 3300 rows, SUM only          52 buffers  0.61 ms
        ```

        So **6.6x fewer buffers and 3.1x faster** as actually shipped.
        The handoff's "12x / 0.687 ms" was measured on a bare `SUM`; the
        shipped version also needs `COUNT(DISTINCT student_id)` to have a
        denominator, and that adds a quicksort of 3,300 rows which roughly
        doubles the time. Against the same bare-`SUM` shape this
        reproduces at 0.61 ms — 5.8x, not 12x, because the 8.7 ms
        baseline was a colder cache than this 3.56 ms one.

        The multiple is the least interesting part. `old` is
        O(institute history) and `new` is O(one paper): at the design's
        45k attempts per institute per month the old plan is reading two
        years of history on every dashboard load while the new one still
        reads ~3,300 rows.

        **② `batch_mock_avg` was a SUM.** It added up every mark scored by
        every student on every paper and presented the total as an
        average. On the seeded institute it now reads **52,471.0** against
        a paper worth 300 — the number grew as more events landed, which
        is the tell. It is now the mean total per student on the latest
        paper: **163.2 of 300 over 44 sitters**. Confirmed fixed.

        **③ `revision_debt_pct` was not a percentage.** It divided a sum
        of per-student overdue counts by the student count — a mean, not a
        share, free to exceed 100 and meaningless against the `%` the UI
        renders beside it. It is now the share of scheduled revisions that
        are overdue, and the old quantity is still available under the
        name it should always have had, `avg_revision_debt`.

        **④ `?batch=` now scopes the whole strip.** The console has had a
        batch filter since the first frontend pass and the KPI strip
        ignored it (`web/src/api/gaps.ts: DASHBOARD_BATCH_SCOPE`), so
        picking "Alpha" narrowed the triage table underneath a header
        still reporting the whole institute — two different populations
        stacked on one screen with nothing to say so. Every count,
        average and rate below is filtered; `batch_id` / `batch_name` come
        back in the payload so the caller can prove which one it got.
      parameters:
      - in: query
        name: batch
        schema:
          type: integer
        description: |-
          Scope every KPI to one batch (`Batch.id`, from `/api/batches/`). Omit it for the whole institute. The response echoes `batch_id` / `batch_name` so the caller can tell a filtered strip from an unfiltered one. A batch id belonging to another institute is a 404, not a silent strip of zeroes.

          `latest_paper_*` stays institute-wide: it names the institute's most recent mock, and `batch_mock_avg` is that paper restricted to this batch's students. If the batch did not sit it, `latest_paper_students` is 0 and `batch_mock_avg` is null.
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      tags:
      - dashboard
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/flags/:
    get:
      operationId: flags_list
      description: |-
        Detector output — what the console triages, newest first.

        Every filter below was already implemented and none of them were in
        the contract, so the console reached them through an
        `undocumentedQuery` escape hatch and re-applied each one client-side
        in case the server ignored it
        (`web/src/api/gaps.ts: FLAGS_OPEN_FILTER`). They are declared now.
        `?student=` is genuinely new: Student 360 was fetching every flag in
        the institute and filtering in the browser.

        Ordered by `raised_at` descending. `?open=true` combined with
        `?severity=` is served by the partial index `idx_flag_open`
        `(institute_id, severity, raised_at DESC) WHERE resolved_at IS NULL`,
        with no sort step at all.
      parameters:
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      - in: query
        name: mentor
        schema:
          type: integer
        description: Only flags for students assigned to this mentor (`Mentor.id`,
          from `/api/mentors/`). Students with no mentor never match.
      - in: query
        name: open
        schema:
          type: boolean
        description: '`true` returns only unresolved flags (`resolved_at` is null).
          Any other value, including `false`, is ignored and returns everything —
          this is a presence filter, not a boolean field.'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: severity
        schema:
          type: string
          enum:
          - critical
          - high
          - improving
          - watch
        description: Exact match on the flag's severity. Thresholds are per detector
          and are documented on `FlagSerializer.severity`.
      - in: query
        name: student
        schema:
          type: integer
        description: Only flags raised against this `Student.id`.
      tags:
      - flags
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFlagList'
          description: ''
  /api/flags/{id}/:
    get:
      operationId: flags_retrieve
      description: |-
        Detector output — what the console triages, newest first.

        Every filter below was already implemented and none of them were in
        the contract, so the console reached them through an
        `undocumentedQuery` escape hatch and re-applied each one client-side
        in case the server ignored it
        (`web/src/api/gaps.ts: FLAGS_OPEN_FILTER`). They are declared now.
        `?student=` is genuinely new: Student 360 was fetching every flag in
        the institute and filtering in the browser.

        Ordered by `raised_at` descending. `?open=true` combined with
        `?severity=` is served by the partial index `idx_flag_open`
        `(institute_id, severity, raised_at DESC) WHERE resolved_at IS NULL`,
        with no sort step at all.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this flag.
        required: true
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      tags:
      - flags
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flag'
          description: ''
  /api/flags/{id}/intervene/:
    post:
      operationId: flags_intervene_create
      description: |-
        Log what the mentor did about this flag.

        Deliberately does NOT resolve the flag. Contacting a student is not
        the same event as the student recovering, and `Flag.outcome` is a
        training label for the eventual risk model — so it has to record
        what actually happened, weeks later, not the act of picking up the
        phone. Closing is a separate, explicit judgement: see `resolve`.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this flag.
        required: true
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      tags:
      - flags
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterventionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InterventionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InterventionRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Intervention'
          description: ''
  /api/flags/{id}/interventions/:
    get:
      operationId: flags_interventions_list
      description: |-
        What has been done about this flag, newest first.

        Until this route interventions were write-only: a mentor could log
        one (`intervene`, or the note on `resolve`) and nothing could show
        it back, so the closed-loop panel could say a flag was closed but not
        what anyone did. The loop is the product's claim — flag, act,
        outcome — and the middle step was invisible.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this flag.
        required: true
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - flags
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInterventionList'
          description: ''
  /api/flags/{id}/resolve/:
    post:
      operationId: flags_resolve_create
      description: |-
        Close a flag, recording what actually became of the student.

        Until this existed there was no way to close a flag at all, and the
        consequences compounded quietly:

        * `run_detectors` suppresses a re-raise while a flag for the same
          (student, type, topic) is open — so with nothing ever closing,
          detectors went permanently mute. Seven of eight had already
          stopped firing on the seeded data.
        * `flags_resolved` and `recovery_rate_pct` on the director's KPI
          strip were structurally frozen. "17 of 23 flagged students
          recovered" is the number that renews a contract, and it could
          never move off its seeded value.

        `outcome` is required rather than defaulted. A closed flag with no
        stated outcome is a lost training label, and an honest "declined"
        is worth more to the model than a polite blank.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this flag.
        required: true
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      tags:
      - flags
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagResolveRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FlagResolveRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FlagResolveRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flag'
          description: ''
        '409':
          description: Already resolved
  /api/ingest/batches/:
    get:
      operationId: ingest_batches_list
      description: |-
        Every results file that has been imported, newest first.

        There is deliberately no delete. Attempts are an append-only log, and a
        batch is the receipt for the ones it wrote; removing the receipt would
        leave the attempts with nothing saying where they came from.
      parameters:
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - ingest
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedIngestBatchList'
          description: ''
  /api/ingest/batches/{id}/:
    get:
      operationId: ingest_batches_retrieve
      description: |-
        Every results file that has been imported, newest first.

        There is deliberately no delete. Attempts are an append-only log, and a
        batch is the receipt for the ones it wrote; removing the receipt would
        leave the attempts with nothing saying where they came from.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this ingest batch.
        required: true
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      tags:
      - ingest
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestBatch'
          description: ''
  /api/ingest/mappings/:
    get:
      operationId: ingest_mappings_list
      description: |-
        Saved column renamings — so the second upload of a format is automatic.

        An institute's export names its columns however its software does
        (`Candidate No`, `Seat`), and the same software names them the same way
        next month. Save the mapping once and name it on later uploads.
      parameters:
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - ingest
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedColumnMappingProfileList'
          description: ''
    post:
      operationId: ingest_mappings_create
      description: |-
        Saved column renamings — so the second upload of a format is automatic.

        An institute's export names its columns however its software does
        (`Candidate No`, `Seat`), and the same software names them the same way
        next month. Save the mapping once and name it on later uploads.
      parameters:
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      tags:
      - ingest
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColumnMappingProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ColumnMappingProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ColumnMappingProfileRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnMappingProfile'
          description: ''
  /api/ingest/results/:
    post:
      operationId: ingest_results_create
      description: |-
        Upload a class's results for one paper. Run it with `dry_run` first.

        A dry run does everything an import does except write, and returns the
        same report — which students would fail and why, which questions the
        blueprint is missing, how many answers are new. The cheapest way to find
        out a file is wrong is to ask before it is real.
      parameters:
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      tags:
      - ingest
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResultsUploadRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultsReport'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultsReport'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '409':
          description: 'This exact file was already imported. Body: `{detail, batch_id}`.'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultsReport'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/me/:
    get:
      operationId: me_retrieve
      description: |-
        Who the caller is, and which institute they are bound to.

        The console reads `role` to decide which navigation to render, and
        `institute` to label it. Both come from the same place the tenant
        middleware reads, so a UI that trusts this payload and a database that
        enforces RLS cannot disagree about who the caller is.
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/mentors/:
    get:
      operationId: mentors_list
      description: |-
        The institute's mentors — who a flag can be routed to.

        Added because `POST /api/flags/{id}/intervene/` takes a mentor id and
        nothing in the contract could produce one
        (`web/src/api/gaps.ts: NO_MENTOR_LIST`). The intervention dialog was
        left with a required field it had no way to populate.

        Read-only and deliberately thin: name, email, and how many students
        each one carries, which is what a director picking a mentor wants to
        see. Creating and reassigning mentors stays in the Django admin,
        where it is an occasional back-office act rather than a console flow.

        Tenant-scoped like everything else. Note that `Mentor` is one of the
        17 tables carrying `institute_id` directly, so Postgres RLS covers it
        too — this list cannot cross a tenant boundary even if the mixin were
        removed.
      parameters:
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - mentors
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMentorList'
          description: ''
  /api/mentors/{id}/:
    get:
      operationId: mentors_retrieve
      description: |-
        The institute's mentors — who a flag can be routed to.

        Added because `POST /api/flags/{id}/intervene/` takes a mentor id and
        nothing in the contract could produce one
        (`web/src/api/gaps.ts: NO_MENTOR_LIST`). The intervention dialog was
        left with a required field it had no way to populate.

        Read-only and deliberately thin: name, email, and how many students
        each one carries, which is what a director picking a mentor wants to
        see. Creating and reassigning mentors stays in the Django admin,
        where it is an occasional back-office act rather than a console flow.

        Tenant-scoped like everything else. Note that `Mentor` is one of the
        17 tables carrying `institute_id` directly, so Postgres RLS covers it
        too — this list cannot cross a tenant boundary even if the mixin were
        removed.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this mentor.
        required: true
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      tags:
      - mentors
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mentor'
          description: ''
  /api/misconceptions/:
    get:
      operationId: misconceptions_list
      description: |-
        The misconception taxonomy, for the tagging screen's picker.

        Global, not tenant-scoped: every institute shares one curated vocabulary,
        which is what makes a diagnosis comparable across them. Console only —
        the taxonomy is a description of wrong beliefs, and is not shown to
        students. Ordered by subject, then code.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: subject
        schema:
          type: string
        description: 'Only misconceptions of this subject — pass `TaggableQuestion.subject`.
          Spellings of one subject match each other: `Botany` and `Zoology` find `Biology`
          entries, `Mathematics` finds `Maths`. Blank or omitted: the whole taxonomy.'
      tags:
      - misconceptions
      security:
      - cookieAuth: []
      responses:
