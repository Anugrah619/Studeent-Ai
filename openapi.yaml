  /api/my/topic-states/:
    get:
      operationId: my_topic_states_list
      description: |-
        My per-chapter mastery, weakest first.

        `mastery` is null below the evidence floor — null is "not enough
        attempts to say", never zero. `?forgetting=true` lists the chapters
        I am forecast to be forgetting, fastest first.
      parameters:
      - in: query
        name: forgetting
        schema:
          type: boolean
        description: 'Only chapters whose forecast `retention` is below 0.5, ordered
          by `retention` ascending — the chapters being forgotten fastest come first.
          Chapters never seen have a null retention and are excluded. Combines with
          `weak`. A presence filter: any value other than `true` is ignored.'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: weak
        schema:
          type: boolean
        description: Only chapters with a measured `mastery` below 0.5. Chapters below
          the evidence floor carry a null mastery and are excluded, because 'not enough
          attempts to say' is not the same claim as 'weak'.
      tags:
      - student-app
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTopicStateList'
          description: ''
  /api/my/topics/:
    get:
      operationId: my_topics_list
      description: |-
        The chapters of my syllabus, in teaching order.

        The pick-list for `POST /api/my/study-logs/` and
        `POST /api/my/confidence/`, both of which take a chapter id that
        nothing else in the API could previously produce. Chapters only —
        study time and confidence are recorded at chapter grain.
      parameters:
      - name: page
