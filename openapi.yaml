        duration_min:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
      required:
      - held_on
      - id
      - name
    TimeToFixEnum:
      enum:
      - minutes
      - one_session
      - several_sessions
      - term_long
      type: string
      description: |-
        * `minutes` - minutes
        * `one_session` - one_session
        * `several_sessions` - several_sessions
        * `term_long` - term_long
    Topic:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        kind:
          $ref: '#/components/schemas/KindEnum'
        weight:
          type: number
          format: double
        subject:
          type: string
          readOnly: true
      required:
      - id
      - kind
      - name
      - subject
    TopicState:
      type: object
      description: One (student, chapter) rollup. Returned weakest-mastery-first.
      properties:
        id:
          type: integer
          readOnly: true
        topic:
          allOf:
          - $ref: '#/components/schemas/Topic'
          readOnly: true
        mastery:
          type: number
          format: double
          readOnly: true
          nullable: true
          description: 'Measured command of this chapter, 0–1. **Null below the evidence
            floor of 4 attempts** — roughly a quarter of rows on the seeded data.
            Null is not zero and must not render as 0%: it means not enough evidence
            to say, and a client that conflates the two shows a diligent new student
            as a crisis.'
        retention:
          type: number
          format: double
          readOnly: true
          nullable: true
          description: Forecast recall probability, 0–1, decayed since `last_revised`.
        attempts_n:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        correct_n:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        exposure_min:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        avg_time_spent:
          type: number
          format: double
          nullable: true
        self_rating:
          type: integer
          readOnly: true
          nullable: true
          description: The student's own latest confidence, 1–5. Null if never rated.
        confidence_gap:
          type: number
          format: double
          readOnly: true
          nullable: true
          description: '`self_rating` rescaled to 0–1 minus `mastery`, so both sides
            are on one scale. **Positive means overconfident** — rates it strong,
            scores weak. Null when either input is missing.'
        last_seen:
          type: string
          format: date-time
          nullable: true
        last_revised:
          type: string
          format: date-time
          nullable: true
      required:
      - confidence_gap
      - id
      - mastery
      - retention
      - self_rating
      - topic
    VerdictEnum:
      enum:
      - agreed
      - disagreed
      type: string
      description: |-
        * `agreed` - agreed
        * `disagreed` - disagreed
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
