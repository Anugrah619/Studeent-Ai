components:
  schemas:
    Attempt:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        question_id:
          type: string
          maxLength: 100
        topic_name:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/StatusEnum'
        time_spent:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        marks:
          type: number
          format: double
        source:
          $ref: '#/components/schemas/SourceEnum'
        ts:
          type: string
          format: date-time
      required:
      - id
      - question_id
      - status
      - topic_name
      - ts
    Batch:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        exam_code:
          type: string
          readOnly: true
        year:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        exam_date:
          type: string
          format: date
          nullable: true
        student_count:
          type: integer
          readOnly: true
      required:
      - exam_code
      - id
      - name
      - student_count
      - year
    BlankEnum:
