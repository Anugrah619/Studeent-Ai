      - label
      - misconception
      - text
    TaggableQuestion:
      type: object
      description: One question as the tagging screen edits it.
      properties:
        id:
          type: integer
          description: '`QuestionTopicMap.id` — the `question_pk` the PATCH route
            takes.'
        label:
          type: string
          description: 'As the paper prints it: `Q14`, `D16`.'
        topic:
          type: string
          nullable: true
          description: Chapter name. Null if unmapped.
        topic_id:
          type: integer
          nullable: true
        subject:
          type: string
          nullable: true
          description: The question's subject — its chapter's root in the syllabus
            tree. Pass it to `GET /api/misconceptions/?subject=` to offer only the
            misconceptions a tag may use. Null when nothing places the question.
        answer_type:
          $ref: '#/components/schemas/AnswerTypeEnum'
        correct_option:
          type: string
          nullable: true
          description: Label of the correct option; comma-joined when the official
            key accepts more than one (`1,2`). Null for a numerical-value question.
        official_answer:
          type: string
          description: The key as stored — the number, for a numerical question.
        question_text:
          type: string
        solution:
          type: string
        difficulty:
          oneOf:
          - $ref: '#/components/schemas/DifficultyEnum'
          - $ref: '#/components/schemas/BlankEnum'
        verification:
          description: |-
            Trust in this question's answer key. `agreed`: the factory's blind solve matched the official key. `disagreed`: it did not, and nobody has reviewed it. `key_stands` / `key_wrong` / `key_unclear`: a person's decision on a disagreement. `unverifiable`: could not be checked. Blank: never cross-checked — an institute's own or a demo paper, whose key is its author's. Trusted keys: blank, `agreed`, `key_stands`.

            * `` - Not cross-checked
            * `agreed` - Model agreed with the official key
            * `disagreed` - Model disagreed — needs a person
            * `unverifiable` - Could not be checked (e.g. unreadable figure)
            * `key_stands` - Model disagreed; a person confirmed the key
            * `key_wrong` - Model disagreed; a person found the key wrong
            * `key_unclear` - Model disagreed; a person could not settle it
          oneOf:
          - $ref: '#/components/schemas/VerificationEnum'
          - $ref: '#/components/schemas/BlankEnum'
        has_answers:
          type: boolean
          description: 'Students have answers recorded here. Informational: tags and
            text may still be edited, because they change no one''s marks.'
        options:
          type: array
          items:
            $ref: '#/components/schemas/TaggableOption'
          description: In label order. Empty for a numerical-value question.
      required:
      - answer_type
      - correct_option
      - difficulty
      - has_answers
      - id
      - label
      - official_answer
      - options
      - question_text
      - solution
      - subject
      - topic
      - topic_id
      - verification
