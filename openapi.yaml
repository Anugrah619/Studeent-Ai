  /api/papers/{id}/blueprint/:
    post:
      operationId: papers_blueprint_create
      description: |-
        Set which chapter each question tests and what its right answer is.

        Once per paper, before any results. All or nothing: one bad row and
        nothing is written, with every problem listed at once. 200 means applied
        (or, with `dry_run`, that it would be); 422 means it was not and why.
        Idempotent — uploading the same blueprint again changes nothing.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      tags:
      - ingest
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BlueprintUploadRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlueprintReport'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlueprintReport'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/papers/{id}/questions/:
    get:
      operationId: papers_questions_retrieve
      description: |-
        A paper's questions for the tagging screen, whole, with progress counts.

        `summary.wrong_options_tagged` against `summary.wrong_options` is how
        far the paper is from being diagnosable. Only what students actually
        chose matters to a diagnosis, so a paper does not have to be finished
        to be useful — but an untagged option a student picked is a wrong
        answer the diagnosis cannot explain.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      tags:
      - papers
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaperQuestions'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: No such paper in this institute.
  /api/papers/{id}/questions/{question_pk}/:
    patch:
      operationId: papers_questions_partial_update
      description: |-
        Set a question's text and solution, and tag or describe its options.

        Partial: only what is sent changes, and within `options` only the
        labels named. Every problem is reported at once and nothing is written
        unless there are none. Allowed on questions students have already
        answered — a tag changes no one's marks, only what the next diagnosis
        can say. Returns the question as `GET …/questions/` shows it.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      - in: path
        name: question_pk
        schema:
          type: integer
        required: true
      tags:
      - papers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedQuestionContentUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedQuestionContentUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedQuestionContentUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaggableQuestion'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: 'Nothing was written. DRF''s validation-error shape: each field
            maps to a list of sentences. For `options` that is either a list of sentences
            (a problem with the list as a whole — a numerical question, a label named
            twice) or a list aligned with the request''s `options`, each entry `{}`
            or `{field: [sentences]}` — e.g. the correct option given a misconception,
            a code not in the taxonomy, a code of another subject, or a tag on a question
            whose key a reviewer found wrong.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: No such paper in this institute, or no such question on it.
  /api/questions/{id}/:
    get:
      operationId: questions_retrieve
      description: |-
        The stem, every option, which is correct, and what each wrong one means.

        With `?student=`, also which option this student chose — which is
        the pairing that makes the diagnosis checkable: the claim says
        "reverses the directing-effect rule", and here is the option that
        exactly that reversal produces, ticked.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this question topic map.
        required: true
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      - in: query
        name: student
        schema:
          type: integer
        description: |-
          Show this question **as one student answered it**: `options[].chosen`, plus `chosen_label`, `status`, `marks` and `time_spent`.

          This is what `DiagnosisEvidence.question_id` is for — pair it with the student whose diagnosis cited it and the panel shows the stem, the option they reached for, and what reaching for it indicates.

          Omit it and those fields are all null and `options[].chosen` is null too, which is 'not asked' rather than 'not chosen'. A student id from another institute is a 404, not a silently unanswered question.
      tags:
      - questions
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: No such question, or no such student, in this institute.
  /api/review/disagreements/:
    get:
      operationId: review_disagreements_list
      description: |-
        The answer-key review queue, oldest paper first, in paper order.

        Every question the cross-check ever disagreed on — reviewed or not —
        so a decision stays visible after it is made. `?status=unreviewed` is
        the queue itself.
      parameters:
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: paper
        schema:
          type: integer
        description: Only questions on this `TestPaper.id`.
      - in: query
        name: status
        schema:
          type: string
          enum:
          - key_stands
          - key_wrong
          - reviewed
          - unclear
          - unreviewed
        description: '`unreviewed`: still `disagreed`, nobody has decided. `reviewed`:
          any decision. Or one decision. Omitted (or anything else): all of them.'
      tags:
      - review
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedKeyDisagreementList'
          description: ''
  /api/review/disagreements/{question_pk}/:
    post:
      operationId: review_disagreements_create
      description: |-
        `key_stands`, `key_wrong` or `unclear`, with an optional note.

        Records who decided and when, moves the question's `verification` out
        of `disagreed` (to `key_stands`, `key_wrong` or `key_unclear`), and
        keeps every earlier decision in its history. A later decision
        replaces this one — an `unclear` can become `key_stands` once an
        expert has looked. Returns the updated row.
      parameters:
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      - in: path
        name: question_pk
        schema:
          type: integer
        required: true
      tags:
      - review
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisagreementReviewRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DisagreementReviewRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DisagreementReviewRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyDisagreement'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: '`decision` missing or not one of the three.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: No such question in this institute, or one the cross-check
            did not disagree on — the same body either way.
  /api/students/:
    get:
      operationId: students_list
      description: 'The triage table: one row per student, worst risk first.'
      parameters:
      - in: query
        name: active
        schema:
          type: boolean
        description: Only students who have not left (`exited_at` is null).
      - in: query
        name: at_risk
        schema:
          type: boolean
        description: Only students whose `risk_score` is at or above 0.55, the console's
          at-risk threshold. Students with no score yet are excluded — an unscored
          student is unmeasured, not safe.
      - in: query
        name: batch
        schema:
          type: integer
        description: Only students in this batch.
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -mock_avg
          - -mock_trend
          - -name
          - -open_flags
          - -risk_score
          - -roll_no
          - mock_avg
          - mock_trend
          - name
          - open_flags
          - risk_score
          - roll_no
        description: 'Sort column, `-` for descending, comma-separated for tie-breakers.
          Unknown fields are ignored. Default: `-risk_score,name`. `name` is always
          appended as a final tie-break so paging is stable.'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Case-insensitive substring match on `name` or `roll_no`. Ignored
          when blank.
      tags:
      - students
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStudentListList'
          description: ''
  /api/students/{id}/:
    get:
      operationId: students_retrieve
      description: |-
        Students and their derived state — the director's triage surface.

        The list route is the triage table; the `@action` routes below are
        Student 360's panels. Every one of them is scoped to the caller's
        institute and every one of them is paginated (see
        `apps/api/pagination.py` for why that is uniform rather than
        convenient).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this student.
        required: true
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      tags:
      - students
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentDetail'
          description: ''
  /api/students/{id}/account/:
    post:
      operationId: students_account_create
      description: |-
        Issue this student a login: their roll number and a temporary password.

        The institute provides the credentials; the student signs in with
        their **roll number** and must choose their own password before they
        can do anything else. The temporary password comes back **once**, in
        this response — hand it over, don't store it. Lost? `reset-password`.

        409 if the student already has a login, and deliberately so: issuing
        is not "make sure they can sign in", because re-sending it for a
        student who had already chosen a password would not be harmless.
        Students who have left the institute (`exited_at`) are refused.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this student.
        required: true
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      tags:
      - students
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentCredentialRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StudentCredentialRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StudentCredentialRequestRequest'
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentCredential'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/students/{id}/account/reset-password/:
    post:
      operationId: students_account_reset_password_create
      description: |-
        Give this student a new temporary password, and make them change it.

        For a forgotten password or a lost phone. It also signs the student
        out everywhere — a changed password invalidates every session that
        held the old one — and re-activates a disabled login. 409 if the
        student has no login yet; issue one instead.
