        id:
          type: integer
          readOnly: true
        topic:
          allOf:
          - $ref: '#/components/schemas/Topic'
          readOnly: true
        mastery:
          type: number
          format: double
          readOnly: true
          nullable: true
          description: 'Measured command of this chapter, 0–1. **Null below the evidence
            floor of 4 attempts** — roughly a quarter of rows on the seeded data.
            Null is not zero and must not render as 0%: it means not enough evidence
            to say, and a client that conflates the two shows a diligent new student
            as a crisis.'
        retention:
          type: number
          format: double
          readOnly: true
          nullable: true
          description: 'Forecast probability, 0–1, that the student would recall this
            chapter today — an exponential forgetting curve, `exp(-t / S)`. `t` is
            days since the later of `last_seen` (newest attempt) and `last_revised`
            (newest completed revision). `S`, the stability in days, is `10 × 2.5^(completed
            revision cycles, at most 3) × (0.5 + mastery)`, with a null mastery counted
            as 0.5: so a chapter met once at middling mastery falls to 50% in about
            a week, and each completed revision cycle makes it fade 2.5× slower. **Null
            when the chapter was never seen** (no attempt and no completed revision;
            a study log alone does not count). Computed as of the last recompute —
            nightly, and after the student''s own events — so it is a forecast for
            that moment, not a live clock. Below 0.5 is what `?forgetting=true` returns
            and what the planner treats as worth a revise block. The constants are
            stated priors, not fitted values.'
        attempts_n:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        correct_n:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        exposure_min:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        avg_time_spent:
          type: number
          format: double
          nullable: true
        self_rating:
          type: integer
          readOnly: true
          nullable: true
          description: The student's own latest confidence, 1–5. Null if never rated.
        confidence_gap:
          type: number
          format: double
          readOnly: true
          nullable: true
          description: '`self_rating` rescaled to 0–1 minus `mastery`, so both sides
            are on one scale. **Positive means overconfident** — rates it strong,
            scores weak. Null when either input is missing.'
        last_seen:
          type: string
          format: date-time
          nullable: true
        last_revised:
          type: string
          format: date-time
          nullable: true
      required:
      - confidence_gap
      - id
      - mastery
      - retention
      - self_rating
      - topic
    VerdictEnum:
      enum:
      - agreed
      - disagreed
      type: string
      description: |-
        * `agreed` - agreed
        * `disagreed` - disagreed
    VerificationEnum:
      enum:
      - agreed
      - disagreed
      - unverifiable
      - key_stands
      - key_wrong
      - key_unclear
      type: string
      description: |-
        * `` - Not cross-checked
        * `agreed` - Model agreed with the official key
        * `disagreed` - Model disagreed — needs a person
        * `unverifiable` - Could not be checked (e.g. unreadable figure)
        * `key_stands` - Model disagreed; a person confirmed the key
        * `key_wrong` - Model disagreed; a person found the key wrong
        * `key_unclear` - Model disagreed; a person could not settle it
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
