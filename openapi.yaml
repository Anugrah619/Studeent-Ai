        Mistake taxonomy for one paper — the line that sells the product.

        The four cause fields and `total_lost` / `recoverable` are unchanged
        from v0.1. Everything else is additive: paper identity, the score the
        taxonomy partitions, the student's own pace baseline that the cause
        rules used, and the per-chapter breakdown a mentor asks for next.
      properties:
        paper_id:
          type: integer
        paper_name:
          type: string
        held_on:
          type: string
          format: date
        max_marks:
          type: integer
        questions:
          type: integer
        attempted:
          type: integer
        score:
          type: number
          format: double
        conceptual_gap:
          type: integer
        execution_error:
          type: integer
        time_exhaustion:
          type: integer
        avoidable_skip:
          type: integer
        total_lost:
          type: integer
        recoverable:
          type: integer
          description: Marks lost to causes that need no new learning.
        time_baseline_sec:
          type: number
          format: double
          nullable: true
          description: Median seconds this student spends on a question they get right.
            Null when they have fewer than 8 timed correct answers, in which case
            the time rule was not applied.
        causes:
          type: array
          items:
            $ref: '#/components/schemas/MarksLostCause'
        top_loss_topics:
          type: array
          items:
            $ref: '#/components/schemas/LossTopic'
      required:
