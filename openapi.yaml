          - $ref: '#/components/schemas/FlagResolveOutcomeEnum'
          description: |-
            What actually became of the student. Required.

            * `recovered` - recovered
            * `declined` - declined
            * `unknown` - unknown
        note:
          type: string
          description: Optional. If given, also logged as an Intervention.
      required:
      - outcome
