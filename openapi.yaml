        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Not a student account.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/my/plan/:
    get:
      operationId: my_plan_list
      description: |-
