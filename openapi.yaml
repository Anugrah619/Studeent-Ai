  /api/students/{id}/diagnosis/:
    get:
      operationId: students_diagnosis_retrieve
      description: |-
        What this student actually misunderstands — the product's core claim.

        Deterministic code counts which distractors were chosen and what each
        cost. The model does the part that is genuinely judgement: whether
        this is a systematic misconception or scattered carelessness, and
        what the *correct* answers reveal about where the error starts.

        Fails loudly rather than degrading to generic advice. A model told
        only "got Q17 wrong, topic Rotational Motion" returns "revise
        Rotational Motion" — worse than an honest error, because it looks
        like an answer.

        **Every error body here is prose, not a developer message.** This
        panel is read over a mentor's shoulder by the person deciding
        whether to buy the product, and "GEMINI_API_KEY is not set" in front
        of them costs more than the outage does. The exception text is
        logged; what is returned is a sentence that explains the situation
        and says whether anything is actually wrong.
      parameters:
      - in: query
        name: force
        schema:
          type: boolean
        description: Bypass the cache and re-reason.
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this student.
        required: true
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      - in: query
        name: paper
        schema:
          type: integer
        description: Restrict the diagnosis to one paper. Echoed back as `paper_id`
          / `paper_name`, so the response says what it is about and can be cached
          under its own key. Omit it and the diagnosis spans every paper the student
          has sat, and both fields come back null.
      tags:
      - reasoning
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Diagnosis'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: No such paper in this institute.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: 'Nothing to diagnose. A real state of the data, not a failure:
            either no wrong answer here has its chosen option recorded, or none of
            those options has been described yet. `detail` is a complete sentence
            written for a coaching director and is safe to show verbatim.'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: The reasoning service could not be reached. `detail` is written
            for a coaching director and is safe to show verbatim; the technical cause
            is logged server-side rather than returned.
