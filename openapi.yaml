        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: paper
        schema:
          type: integer
        description: Only attempts recorded against this `TestPaper.id`. Omit it and
          you get practice attempts too — which on the seeded data is ~490 rows per
