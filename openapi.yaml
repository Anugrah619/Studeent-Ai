          description: Not a student account.
  /api/my/guidance/ask/:
    post:
      operationId: my_guidance_ask_create
      description: |-
        Answer a question about my preparation — not a doubt about a chapter.

        "What should I focus on this week?" and "why is X in my plan?" are
        answered from my own plan, weakest chapters, due revisions and recent
        mocks. A request to solve a question or explain a concept is politely
        declined with a pointer to my teacher; health and wellbeing get a kind
        pointer to my mentor or a trusted adult and no advice.

        My name, roll number, mentor, institute, and any phone number or email
        are removed from the question before it leaves the server.
      tags:
      - student-app
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AskRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AskRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskAnswer'
          description: ''
        '400':
          description: '`question` missing, blank, or over 500 characters. DRF''s
            field-error shape: `{"question": ["..."]}`.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Not a student account.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Today's questions are used up (`guidance_ask`, about 20 a day).
            Repeating a question already answered is not counted.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: The guide cannot answer now. `detail` is a sentence for the
            student, safe to show verbatim.
