      - roll_no
    MyProgress:
      type: object
      description: |-
        The slice of `StudentState` a student is shown about themselves.

        `risk_score`, `load_index` and `balance_index` are withheld. They are
        inputs to a mentor's triage, not feedback for a seventeen-year-old: a
        number that says "critical" with no conversation around it is a poor way
        to learn it. Nothing is hidden that the student cannot see another way —
        `/api/my/subject-breakdown/` carries the balance in plain terms. Whether
        students should see a risk band at all is a product decision, and showing
        less first is the one that can be undone.
      properties:
        consistency:
          type: number
          format: double
          readOnly: true
          nullable: true
          description: Study regularity, 0–1. Share of recent days with any logged
            study.
        revision_debt:
          type: integer
          readOnly: true
          description: Count of revision cycles now past due and not done.
        mock_avg:
          type: number
          format: double
          readOnly: true
          nullable: true
          description: Mean total marks across this student's papers.
        mock_trend:
          type: number
          format: double
          readOnly: true
          nullable: true
          description: Marks gained or lost across recent papers. **Signed marks,
            not a percentage** — negative is a decline, and -40 is the point where
            the decline component of `risk_score` saturates.
        syllabus_pct:
          type: number
          format: double
          readOnly: true
          nullable: true
          description: 'Share of the *batch''s* chapters marked taught, 0–100. A batch
            property, not a student one: a student cannot be behind on a chapter nobody
            has taught yet.'
        computed_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - computed_at
      - consistency
      - mock_avg
      - mock_trend
      - revision_debt
      - syllabus_pct
    MyQuestion:
      type: object
      description: A question I answered, with the correct answer and the working.
      properties:
        id:
          type: integer
          readOnly: true
        label:
          type: string
          readOnly: true
          description: The question as the paper prints it — `"D16"`. Unique within
            a paper, **not** across papers, which is why `id` and not this is what
            `DiagnosisEvidence.question_id` carries. Stored as `QuestionTopicMap.question_id`.
        paper_id:
          type: integer
          readOnly: true
        paper_name:
          type: string
          readOnly: true
        topic:
          type: string
          readOnly: true
          nullable: true
          description: Chapter. Null on a question nobody has mapped yet.
        subject:
          type: string
          nullable: true
          readOnly: true
        difficulty:
          oneOf:
          - $ref: '#/components/schemas/DifficultyEnum'
          - $ref: '#/components/schemas/BlankEnum'
        question_text:
          type: string
        solution:
          type: string
          description: The worked method, not just the final answer.
        options:
          type: array
          items:
            $ref: '#/components/schemas/MyQuestionOption'
          readOnly: true
        chosen_label:
          type: string
          readOnly: true
          nullable: true
          description: The option letter this student picked. Null when `?student=`
            was not given, and also when it was but the student left this question
            blank or never reached it — `status` distinguishes those.
        status:
          readOnly: true
          nullable: true
          description: |-
            What became of this question for this student. A closed set, because `blank` and `not_reached` are the distinction the whole marks-lost taxonomy rests on — choosing to skip and running out of time need opposite advice. Null when `?student=` was not given, or when this student has no attempt recorded here.

            * `correct` - Correct
            * `wrong` - Wrong
            * `blank` - Skipped deliberately
            * `not_reached` - Ran out of time
          oneOf:
          - $ref: '#/components/schemas/StatusEnum'
          - $ref: '#/components/schemas/NullEnum'
        marks:
          type: number
          format: double
          readOnly: true
          nullable: true
          description: Marks scored on this question after negative marking. Null
            as above.
        time_spent:
          type: integer
          readOnly: true
          nullable: true
          description: Seconds spent. Often genuinely absent even when the attempt
            exists.
        source:
          $ref: '#/components/schemas/PaperSourceEnum'
        source_ref:
          type: string
          maxLength: 160
      required:
      - chosen_label
      - id
      - label
      - marks
      - options
      - paper_id
      - paper_name
      - status
      - subject
      - time_spent
      - topic
    MyQuestionOption:
      type: object
      description: |-
        An option as the student who answered it sees it: no misconception.

        `QuestionOptionSerializer` explains *why a wrong option was tempting* —
        "reverses the directing-effect rule". That is the diagnosis, written for
        the mentor who decides how to say it. A student reviewing a mistake gets
        the question, the answer and the worked solution; whether they are also
        told which belief the system thinks they hold is the product decision
        recorded in `MyProgressSerializer`, and is held back for the same reason.
      properties:
        label:
          type: string
          maxLength: 2
        text:
          type: string
          maxLength: 500
        is_correct:
          type: boolean
        chosen:
          type: boolean
          readOnly: true
      required:
      - chosen
      - label
      - text
    MyRevision:
      type: object
      description: 'One scheduled revision cycle: R1, R2, R3 of a chapter.'
      properties:
        id:
          type: integer
          readOnly: true
        topic:
          allOf:
          - $ref: '#/components/schemas/Topic'
          readOnly: true
        cycle:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        scheduled_for:
          type: string
          format: date
        done_at:
          type: string
          format: date-time
          nullable: true
        is_overdue:
          type: boolean
          readOnly: true
          description: Scheduled before today and not yet done.
      required:
      - cycle
      - id
      - is_overdue
      - scheduled_for
      - topic
    MyTopic:
      type: object
      description: |-
        A chapter as the student's pick-list shows it.

        `ncert_ref` is the point of the extra weight: where to re-read the
        chapter in the current NCERT textbooks, loaded from the official
        syllabus documents. Until this route nothing returned it, so the links
        existed in the database and nowhere a student could follow them.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        kind:
          $ref: '#/components/schemas/KindEnum'
        weight:
          type: number
          format: double
        subject:
          type: string
          readOnly: true
        unit:
          type: string
          readOnly: true
        ncert_ref:
          readOnly: true
          nullable: true
          description: 'Where to re-read this chapter in the NCERT textbooks: a list
            of `{class, subject, book, chapter, title, pdf, sections?}`. Null when
            the chapter has no NCERT counterpart or has not been linked yet. `sections`
            appears only when just part of the NCERT chapter applies.'
      required:
      - id
      - kind
      - name
      - ncert_ref
      - subject
      - unit
    NextAction:
      type: object
      description: |-
        One thing to do next, worked out by rules from the student's own data.

        No model is involved, and nothing here is a label about the student:
        every `title` and `detail` is an action and the fact behind it.
      properties:
        kind:
          allOf:
          - $ref: '#/components/schemas/GuidanceActionKindEnum'
          description: |-
            Which rule produced this. The list is ranked by kind, in the order the enum lists them: `start_plan`/`make_plan`, `revisions_due`, `mock_recoverable`, `weak_chapter`, `log_study`, `rate_confidence`. At most one of each.

            * `start_plan` - Today's plan is ready and not started
            * `make_plan` - No plan for today yet
            * `revisions_due` - Revisions due or overdue
            * `mock_recoverable` - Marks on the latest mock that needed no new learning
            * `weak_chapter` - The weakest measured chapter
            * `log_study` - No study logged recently
            * `rate_confidence` - Weak chapters with no confidence rating
        title:
          type: string
          description: One line, safe to show verbatim.
        detail:
          type: string
          description: 'One or two sentences: the fact behind the action.'
        target:
          oneOf:
          - type: string
            enum:
            - plan
            - revisions
            - topics
            - study-log
            - confidence
            description: 'A screen of the student app: `plan`, `revisions`, `topics`
              (chapter mastery), `study-log`, or `confidence`.'
          - type: object
            properties:
              mock:
                type: integer
                description: A `paper_id` this student sat — what `GET /api/my/marks-lost/?paper=`
                  takes.
            required:
            - mock
          description: 'Where tapping this should go. A screen name, or `{"mock":
            paper_id}`.'
      required:
      - detail
      - kind
      - target
      - title
    NullEnum:
      enum:
      - null
    Onboarding:
      type: object
      description: |-
        What onboarding shows and stores — read model for `/api/my/onboarding/`.

        The exam, its date and the batch are the institute's decisions, read off
        the student's batch and shown for confirmation only: a student cannot
        move themselves to another exam or batch here. What the student owns is
        how long they can study a day and the rank they are aiming for.
      properties:
        exam_code:
          type: string
          readOnly: true
          description: The batch's exam, e.g. `JEE_MAIN`. Read-only.
        exam_name:
          type: string
          readOnly: true
          description: Display name of the exam. Read-only.
        exam_date:
          type: string
          format: date
          readOnly: true
          nullable: true
          description: The day the batch sits the exam. Null when the institute has
            not set it. Read-only.
        batch_name:
          type: string
          readOnly: true
          description: The batch the institute placed the student in. Read-only.
        target:
          type: string
          readOnly: true
          description: The free-text target the institute recorded ("AIR < 5000"),
            or an empty string. Read-only here; `target_rank` is the student's own
            number.
        target_rank:
          type: integer
          readOnly: true
          nullable: true
          description: The rank the student is aiming for (1 or more). Null until
            they say.
        daily_minutes:
          type: integer
          readOnly: true
          nullable: true
          description: Minutes a day the student says they can study, 45–720. Null
            until onboarding. The day planner uses it before the median of what they
            log, clamped to its 90–360 minute budget.
        onboarded_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When onboarding was first saved. Set once; later edits do not
            move it.
        needs_onboarding:
          type: boolean
          readOnly: true
          description: True until onboarding has been saved once (`onboarded_at` is
            null).
      required:
      - batch_name
      - daily_minutes
      - exam_code
      - exam_date
      - exam_name
      - needs_onboarding
      - onboarded_at
      - target
      - target_rank
    OnboardingUpdateRequest:
      type: object
      description: The body of `PUT /api/my/onboarding/`. A PUT replaces both fields.
      properties:
        daily_minutes:
          type: integer
          maximum: 720
          minimum: 45
          description: Required. Minutes a day you can study, 45–720.
        target_rank:
          type: integer
          minimum: 1
          nullable: true
          description: 'The rank you are aiming for, 1 or more. Optional: omitting
            it or sending null clears it, because a PUT replaces the whole answer.'
      required:
      - daily_minutes
    OptionContentUpdateRequest:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          description: 'Which option: `A`, or `1` on an official paper.'
          maxLength: 2
        text:
          type: string
          description: The option's text. Omit to leave it unchanged.
          maxLength: 500
        misconception_code:
          type: string
          nullable: true
          description: Tag this wrong option with a taxonomy code (`GET /api/misconceptions/`).
            Null or blank removes the tag; omit to leave it unchanged. Refused on
            the correct option, for a code not in the taxonomy, and for a code of
            another subject.
          maxLength: 32
        draft_misconception:
          allOf:
          - $ref: '#/components/schemas/DraftMisconceptionProposalRequest'
          nullable: true
          description: Propose a belief the taxonomy lacks. Stored as a draft that
            counts for nothing until a person adds it to the taxonomy and tags the
            option with it. Null clears the option's draft; omit to leave it.
      required:
      - label
