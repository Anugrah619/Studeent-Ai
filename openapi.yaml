    StudentList:
      type: object
      description: |-
        Row in the director's triage table.

        Sortable on `risk_score`, `mock_avg`, `mock_trend`, `open_flags`,
        `name` and `roll_no` via `?ordering=`; default `-risk_score,name`.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        roll_no:
          type: string
          maxLength: 50
        batch_name:
          type: string
          readOnly: true
        mentor_name:
          type: string
          readOnly: true
        target:
          type: string
          maxLength: 100
        risk_score:
          type: number
          format: double
          readOnly: true
          description: |-
            Composite risk on a **0–1** scale, not 0–100. Null when there is not yet enough signal to score the student at all — an unscored student is unmeasured, not safe, and sorts out of the triage table rather than sitting at a confident 0.0.

            Bands, which `?at_risk=true` and the console's chips both key off:
            - `>= 0.75` critical
            - `>= 0.55` high — this is the at-risk threshold
            - `>= 0.35` watch
            - below that, ok

            It is a weighted sum of four normalised components, each explainable on its own: mock decline 0.50, subject imbalance 0.20, inconsistent study 0.20, revision debt 0.10. Components with no data are dropped and the remainder renormalised, so a student is never penalised for what is not known about them. These weights are a stated prior, not a trained model.
        mock_trend:
          type: number
          format: double
          readOnly: true
          description: Marks gained or lost across recent papers. Signed marks, not
            a percentage.
        mock_avg:
          type: number
          format: double
          readOnly: true
          description: Mean total marks across this student's papers.
        open_flags:
          type: integer
          readOnly: true
          description: Flags currently unresolved for this student.
        exited_at:
          type: string
          format: date
          nullable: true
        login_status:
          allOf:
          - $ref: '#/components/schemas/LoginStatusEnum'
          readOnly: true
      required:
      - batch_name
      - id
      - login_status
      - mentor_name
      - mock_avg
      - mock_trend
      - name
      - open_flags
      - risk_score
      - roll_no
    StudentState:
      type: object
      description: |-
        The per-student rollup behind Student 360's health header.

        Every float here is on a stated scale, because the one field that was
        not (`risk_score`) got rendered on the wrong one.
      properties:
        consistency:
          type: number
          format: double
          readOnly: true
          nullable: true
          description: Study regularity, 0–1. Share of recent days with any logged
            study.
        load_index:
          type: number
          format: double
          readOnly: true
          nullable: true
          description: 'Study hours this month over last month, clamped to 0–3. **A
            ratio, not a fraction**: 1.0 is steady, 1.3 is a third more work than
            last month. Null when there is no prior month.'
        balance_index:
          type: number
          format: double
          readOnly: true
          nullable: true
          description: Largest gap, 0–1, between a subject's share of study time and
            its share of marks lost. 0 is perfectly aimed effort. Below 0.10 is normal
            variation rather than a signal.
        revision_debt:
          type: integer
          readOnly: true
          description: Count of revision cycles now past due and not done.
        risk_score:
          type: number
          format: double
          readOnly: true
          nullable: true
          description: |-
            Composite risk on a **0–1** scale, not 0–100. Null when there is not yet enough signal to score the student at all — an unscored student is unmeasured, not safe, and sorts out of the triage table rather than sitting at a confident 0.0.

            Bands, which `?at_risk=true` and the console's chips both key off:
            - `>= 0.75` critical
            - `>= 0.55` high — this is the at-risk threshold
            - `>= 0.35` watch
            - below that, ok

            It is a weighted sum of four normalised components, each explainable on its own: mock decline 0.50, subject imbalance 0.20, inconsistent study 0.20, revision debt 0.10. Components with no data are dropped and the remainder renormalised, so a student is never penalised for what is not known about them. These weights are a stated prior, not a trained model.
        mock_avg:
          type: number
          format: double
          readOnly: true
          nullable: true
          description: Mean total marks across this student's papers.
        mock_trend:
          type: number
          format: double
          readOnly: true
          nullable: true
          description: Marks gained or lost across recent papers. **Signed marks,
            not a percentage** — negative is a decline, and -40 is the point where
            the decline component of `risk_score` saturates.
        syllabus_pct:
          type: number
          format: double
          readOnly: true
          nullable: true
          description: 'Share of the *batch''s* chapters marked taught, 0–100. A batch
            property, not a student one: a student cannot be behind on a chapter nobody
            has taught yet.'
        computed_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - balance_index
      - computed_at
      - consistency
      - load_index
      - mock_avg
      - mock_trend
      - revision_debt
      - risk_score
      - syllabus_pct
    StudyLogCreate:
      type: object
      description: |-
        A self-reported study session, as the student enters it.

        Tier-1 data — see `StudyLog`. Backdating is allowed and expected (people
        log in the evening for the afternoon); the model keeps `logged_at`
        separately so a week entered on Sunday is visible as one signal rather
        than seven. Only the future is refused.
      properties:
        id:
          type: integer
          readOnly: true
        topic:
          type: integer
        topic_name:
          type: string
          readOnly: true
        minutes:
          type: integer
          maximum: 720
          minimum: 1
          description: Minutes studied, 1–720.
        mode:
          $ref: '#/components/schemas/ModeEnum'
        ts:
          type: string
          format: date-time
      required:
      - id
      - minutes
      - mode
      - topic
      - topic_name
      - ts
    StudyLogCreateRequest:
      type: object
      description: |-
        A self-reported study session, as the student enters it.

        Tier-1 data — see `StudyLog`. Backdating is allowed and expected (people
        log in the evening for the afternoon); the model keeps `logged_at`
        separately so a week entered on Sunday is visible as one signal rather
        than seven. Only the future is refused.
      properties:
        topic:
          type: integer
        minutes:
          type: integer
          maximum: 720
          minimum: 1
          description: Minutes studied, 1–720.
        mode:
          $ref: '#/components/schemas/ModeEnum'
        ts:
          type: string
          format: date-time
