    PaperQuestions:
      type: object
      description: |-
        A paper's questions, whole, with how far through tagging it is.

        Not paginated, on purpose: it is bounded by one paper (a paper has at most
        300 questions; NEET's is 180), and a tagging screen that showed one page
        beside counts for the whole paper would misreport its own progress.
      properties:
        paper_id:
          type: integer
        paper_name:
          type: string
        paper_source:
          $ref: '#/components/schemas/PaperSourceEnum'
        held_on:
          type: string
          format: date
        summary:
          $ref: '#/components/schemas/PaperQuestionsSummary'
        questions:
          type: array
          items:
            $ref: '#/components/schemas/TaggableQuestion'
      required:
      - held_on
      - paper_id
      - paper_name
      - paper_source
      - questions
      - summary
    PaperQuestionsSummary:
      type: object
      properties:
        questions:
          type: integer
        with_text:
          type: integer
          description: Questions whose stem has been written.
        wrong_options:
          type: integer
          description: Wrong options across the paper — every one a diagnosis could
            use.
        wrong_options_tagged:
          type: integer
          description: Wrong options carrying a confirmed misconception. A paper is
            diagnosable once the options its students actually chose are tagged.
        wrong_options_with_draft:
          type: integer
          description: Untagged wrong options with a pending proposal to act on.
      required:
      - questions
      - with_text
      - wrong_options
      - wrong_options_tagged
      - wrong_options_with_draft
    PaperSourceEnum:
      enum:
      - official_pyq
      - demo
      - generated
      - institute
      type: string
      description: |-
        * `official_pyq` - Official past paper
        * `demo` - Demo (written by us)
        * `generated` - Generated
        * `institute` - Institute's own mock
    PasswordChangeRequest:
      type: object
      description: Replace my password. The first sign-in of a new student ends here.
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
          description: The password I signed in with — the temporary one, the first
            time.
        new_password:
          type: string
