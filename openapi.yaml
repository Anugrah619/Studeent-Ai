                $ref: '#/components/schemas/PaginatedMyTopicList'
          description: ''
  /api/papers/:
    get:
      operationId: papers_list
      description: |-
        Mock papers the institute has held.

        **Ordered by `held_on` descending** — most recent first, from
        `TestPaper.Meta.ordering`. The first element is therefore the paper
        `/api/dashboard/summary/` reports `batch_mock_avg` for, which is what
        lets the console label the KPI without a second request.

        `POST` makes the institute's own mock — the first step of getting its
        results in. Next: `POST /api/papers/{id}/blueprint/`, then
        `POST /api/ingest/results/`.
      parameters:
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - papers
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTestPaperList'
          description: ''
    post:
      operationId: papers_create
      description: |-
        Create the institute's own mock paper.

        Marked `source: institute` — not an official paper, not ours — and
        belongs to the caller's institute whatever the body says. Marking
        defaults to the exam's own scheme. A paper with the same name on the
        same date is refused: the usual cause is a double-submit, and two
        "Mock 15"s on the same day make every later upload ambiguous.
      parameters:
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      tags:
      - papers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestPaperCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TestPaperCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TestPaperCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestPaper'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/papers/{id}/:
    get:
      operationId: papers_retrieve
      description: |-
        Mock papers the institute has held.

        **Ordered by `held_on` descending** — most recent first, from
        `TestPaper.Meta.ordering`. The first element is therefore the paper
        `/api/dashboard/summary/` reports `batch_mock_avg` for, which is what
        lets the console label the KPI without a second request.

        `POST` makes the institute's own mock — the first step of getting its
        results in. Next: `POST /api/papers/{id}/blueprint/`, then
        `POST /api/ingest/results/`.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this test paper.
        required: true
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
