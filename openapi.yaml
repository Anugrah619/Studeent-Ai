openapi: 3.0.3
info:
  title: Student AI API
  version: 0.1.0
  description: Contract between the Django backend and the React console / student
    PWA. This schema is the source of truth — regenerate with `manage.py spectacular
    --file ../openapi.yaml` after any serializer change.
paths:
  /api/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: Sets the `csrftoken` cookie. Call once before POSTing to login.
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Exchange credentials for a session cookie.

        `authentication_classes` is empty on purpose: DRF's
        `SessionAuthentication` enforces CSRF on the *authenticated* path, and
        running it here would have it inspect a session that does not exist
        yet. Django's `CsrfViewMiddleware` still protects this POST.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: End the session. POST only — a GET logout is a CSRF vector.
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/batches/:
    get:
      operationId: batches_list
      description: |-
        The institute's batches, each with its live student count.

        Ordered by name (`Batch.Meta.ordering`). This is the source for the
        console's batch filter, which feeds `?batch=` on `/api/students/` and
        on `/api/dashboard/summary/`.
      parameters:
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - batches
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBatchList'
          description: ''
  /api/batches/{id}/:
    get:
      operationId: batches_retrieve
      description: |-
        The institute's batches, each with its live student count.

        Ordered by name (`Batch.Meta.ordering`). This is the source for the
        console's batch filter, which feeds `?batch=` on `/api/students/` and
        on `/api/dashboard/summary/`.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this batch.
        required: true
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      tags:
      - batches
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
          description: ''
  /api/dashboard/summary/:
    get:
      operationId: dashboard_summary_retrieve
      description: |-
        The director's KPI strip. Three things were wrong with it.

        **① It read the institute's entire attempt history.** The old
        `batch_mock_avg` query was `filter(test_paper__isnull=False)` with
        an `order_by` that the aggregate discarded, so Postgres did a Seq
        Scan over every attempt ever recorded — 24,000 rows and 343
        buffers on the seed, and O(history) on the most-visited page in
        the product. At the design's volume (45k attempts per institute
        per month) that is a multi-second query on every dashboard load.

        No index fixes it, because the query genuinely wanted every row.
        Asking for one paper instead is what fixes it.

        **Re-measured, because the number in the handoff was for a
        different query.** Three warm runs of each, `EXPLAIN (ANALYZE,
        BUFFERS)` against the seeded 24,000 attempts:

        ```
        old  Seq Scan, 24000 rows, SUM only          343 buffers  3.56 ms
        new  Index Scan, 3300 rows, SUM + COUNT(DISTINCT student_id)
                                                      52 buffers  1.14 ms
        new  Index Scan, 3300 rows, SUM only          52 buffers  0.61 ms
        ```

        So **6.6x fewer buffers and 3.1x faster** as actually shipped.
        The handoff's "12x / 0.687 ms" was measured on a bare `SUM`; the
        shipped version also needs `COUNT(DISTINCT student_id)` to have a
        denominator, and that adds a quicksort of 3,300 rows which roughly
        doubles the time. Against the same bare-`SUM` shape this
        reproduces at 0.61 ms — 5.8x, not 12x, because the 8.7 ms
        baseline was a colder cache than this 3.56 ms one.

        The multiple is the least interesting part. `old` is
        O(institute history) and `new` is O(one paper): at the design's
        45k attempts per institute per month the old plan is reading two
        years of history on every dashboard load while the new one still
        reads ~3,300 rows.

        **② `batch_mock_avg` was a SUM.** It added up every mark scored by
        every student on every paper and presented the total as an
        average. On the seeded institute it now reads **52,471.0** against
        a paper worth 300 — the number grew as more events landed, which
        is the tell. It is now the mean total per student on the latest
        paper: **163.2 of 300 over 44 sitters**. Confirmed fixed.

        **③ `revision_debt_pct` was not a percentage.** It divided a sum
        of per-student overdue counts by the student count — a mean, not a
        share, free to exceed 100 and meaningless against the `%` the UI
        renders beside it. It is now the share of scheduled revisions that
        are overdue, and the old quantity is still available under the
        name it should always have had, `avg_revision_debt`.

        **④ `?batch=` now scopes the whole strip.** The console has had a
        batch filter since the first frontend pass and the KPI strip
        ignored it (`web/src/api/gaps.ts: DASHBOARD_BATCH_SCOPE`), so
        picking "Alpha" narrowed the triage table underneath a header
        still reporting the whole institute — two different populations
        stacked on one screen with nothing to say so. Every count,
        average and rate below is filtered; `batch_id` / `batch_name` come
        back in the payload so the caller can prove which one it got.
      parameters:
      - in: query
        name: batch
        schema:
          type: integer
        description: |-
          Scope every KPI to one batch (`Batch.id`, from `/api/batches/`). Omit it for the whole institute. The response echoes `batch_id` / `batch_name` so the caller can tell a filtered strip from an unfiltered one. A batch id belonging to another institute is a 404, not a silent strip of zeroes.

          `latest_paper_*` stays institute-wide: it names the institute's most recent mock, and `batch_mock_avg` is that paper restricted to this batch's students. If the batch did not sit it, `latest_paper_students` is 0 and `batch_mock_avg` is null.
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      tags:
      - dashboard
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/flags/:
    get:
      operationId: flags_list
      description: |-
        Detector output — what the console triages, newest first.

        Every filter below was already implemented and none of them were in
        the contract, so the console reached them through an
        `undocumentedQuery` escape hatch and re-applied each one client-side
        in case the server ignored it
        (`web/src/api/gaps.ts: FLAGS_OPEN_FILTER`). They are declared now.
        `?student=` is genuinely new: Student 360 was fetching every flag in
        the institute and filtering in the browser.

        Ordered by `raised_at` descending. `?open=true` combined with
        `?severity=` is served by the partial index `idx_flag_open`
        `(institute_id, severity, raised_at DESC) WHERE resolved_at IS NULL`,
        with no sort step at all.
      parameters:
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      - in: query
        name: mentor
        schema:
          type: integer
        description: Only flags for students assigned to this mentor (`Mentor.id`,
          from `/api/mentors/`). Students with no mentor never match.
      - in: query
        name: open
        schema:
          type: boolean
        description: '`true` returns only unresolved flags (`resolved_at` is null).
          Any other value, including `false`, is ignored and returns everything —
          this is a presence filter, not a boolean field.'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: severity
        schema:
          type: string
          enum:
          - critical
          - high
          - improving
          - watch
        description: Exact match on the flag's severity. Thresholds are per detector
          and are documented on `FlagSerializer.severity`.
      - in: query
        name: student
        schema:
          type: integer
        description: Only flags raised against this `Student.id`.
      tags:
      - flags
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFlagList'
          description: ''
  /api/flags/{id}/:
    get:
      operationId: flags_retrieve
      description: |-
        Detector output — what the console triages, newest first.

        Every filter below was already implemented and none of them were in
        the contract, so the console reached them through an
        `undocumentedQuery` escape hatch and re-applied each one client-side
        in case the server ignored it
        (`web/src/api/gaps.ts: FLAGS_OPEN_FILTER`). They are declared now.
        `?student=` is genuinely new: Student 360 was fetching every flag in
        the institute and filtering in the browser.

        Ordered by `raised_at` descending. `?open=true` combined with
        `?severity=` is served by the partial index `idx_flag_open`
        `(institute_id, severity, raised_at DESC) WHERE resolved_at IS NULL`,
        with no sort step at all.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this flag.
        required: true
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      tags:
      - flags
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flag'
          description: ''
  /api/flags/{id}/intervene/:
    post:
      operationId: flags_intervene_create
      description: |-
        Log what the mentor did about this flag.

        Deliberately does NOT resolve the flag. Contacting a student is not
        the same event as the student recovering, and `Flag.outcome` is a
        training label for the eventual risk model — so it has to record
        what actually happened, weeks later, not the act of picking up the
        phone. Closing is a separate, explicit judgement: see `resolve`.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this flag.
        required: true
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      tags:
      - flags
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterventionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InterventionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InterventionRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Intervention'
          description: ''
  /api/flags/{id}/resolve/:
    post:
      operationId: flags_resolve_create
      description: |-
        Close a flag, recording what actually became of the student.

        Until this existed there was no way to close a flag at all, and the
        consequences compounded quietly:

        * `run_detectors` suppresses a re-raise while a flag for the same
          (student, type, topic) is open — so with nothing ever closing,
          detectors went permanently mute. Seven of eight had already
          stopped firing on the seeded data.
        * `flags_resolved` and `recovery_rate_pct` on the director's KPI
          strip were structurally frozen. "17 of 23 flagged students
          recovered" is the number that renews a contract, and it could
          never move off its seeded value.

        `outcome` is required rather than defaulted. A closed flag with no
        stated outcome is a lost training label, and an honest "declined"
        is worth more to the model than a polite blank.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this flag.
        required: true
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      tags:
      - flags
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagResolveRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FlagResolveRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FlagResolveRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flag'
          description: ''
        '409':
          description: Already resolved
  /api/me/:
    get:
      operationId: me_retrieve
      description: |-
        Who the caller is, and which institute they are bound to.

        The console reads `role` to decide which navigation to render, and
        `institute` to label it. Both come from the same place the tenant
        middleware reads, so a UI that trusts this payload and a database that
        enforces RLS cannot disagree about who the caller is.
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/mentors/:
    get:
      operationId: mentors_list
      description: |-
        The institute's mentors — who a flag can be routed to.

        Added because `POST /api/flags/{id}/intervene/` takes a mentor id and
        nothing in the contract could produce one
        (`web/src/api/gaps.ts: NO_MENTOR_LIST`). The intervention dialog was
        left with a required field it had no way to populate.

        Read-only and deliberately thin: name, email, and how many students
        each one carries, which is what a director picking a mentor wants to
        see. Creating and reassigning mentors stays in the Django admin,
        where it is an occasional back-office act rather than a console flow.

        Tenant-scoped like everything else. Note that `Mentor` is one of the
        17 tables carrying `institute_id` directly, so Postgres RLS covers it
        too — this list cannot cross a tenant boundary even if the mixin were
        removed.
      parameters:
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - mentors
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMentorList'
          description: ''
  /api/mentors/{id}/:
    get:
      operationId: mentors_retrieve
      description: |-
        The institute's mentors — who a flag can be routed to.

        Added because `POST /api/flags/{id}/intervene/` takes a mentor id and
        nothing in the contract could produce one
        (`web/src/api/gaps.ts: NO_MENTOR_LIST`). The intervention dialog was
        left with a required field it had no way to populate.

        Read-only and deliberately thin: name, email, and how many students
        each one carries, which is what a director picking a mentor wants to
        see. Creating and reassigning mentors stays in the Django admin,
        where it is an occasional back-office act rather than a console flow.

        Tenant-scoped like everything else. Note that `Mentor` is one of the
        17 tables carrying `institute_id` directly, so Postgres RLS covers it
        too — this list cannot cross a tenant boundary even if the mixin were
        removed.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this mentor.
        required: true
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      tags:
      - mentors
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mentor'
          description: ''
  /api/my/plan/:
    get:
      operationId: my_plan_list
      description: |-
        Today's plan for the logged-in student.

        Scoped by the account, not by a path parameter: there is no way to
        ask for another student's plan. A caller with no linked `Student`
        gets an empty list rather than a 403, because a mentor opening the
        student PWA is a navigation mistake, not an attack.

        Ordered by `start_time` ascending.
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: The day to plan for, `YYYY-MM-DD`. Defaults to today in the server's
          local timezone. An unparseable date is a 400 from the ORM.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - student-app
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPlanBlockList'
          description: ''
  /api/my/plan/{id}/complete/:
    post:
      operationId: my_plan_complete_create
      description: |-
        Today's plan for the logged-in student.

        Scoped by the account, not by a path parameter: there is no way to
        ask for another student's plan. A caller with no linked `Student`
        gets an empty list rather than a 403, because a mentor opening the
        student PWA is a navigation mistake, not an attack.

        Ordered by `start_time` ascending.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this plan block.
        required: true
      tags:
      - student-app
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanBlock'
          description: ''
  /api/my/study-logs/:
    get:
      operationId: my_study_logs_list
      description: |-
        The logged-in student's own study log — read and append.

        Ordered by `ts` descending, most recent first. Append-only by
        construction: there is no update or delete route, matching the
        append-only rule the admin enforces on `StudyLog` itself.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - student-app
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStudyLogCreateList'
          description: ''
    post:
      operationId: my_study_logs_create
      description: |-
        The logged-in student's own study log — read and append.

        Ordered by `ts` descending, most recent first. Append-only by
        construction: there is no update or delete route, matching the
        append-only rule the admin enforces on `StudyLog` itself.
      tags:
      - student-app
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudyLogCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StudyLogCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StudyLogCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyLogCreate'
          description: ''
  /api/papers/:
    get:
      operationId: papers_list
      description: |-
        Mock papers the institute has held.

        **Ordered by `held_on` descending** — most recent first, from
        `TestPaper.Meta.ordering`. The first element is therefore the paper
        `/api/dashboard/summary/` reports `batch_mock_avg` for, which is what
        lets the console label the KPI without a second request.
      parameters:
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - papers
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTestPaperList'
          description: ''
  /api/papers/{id}/:
    get:
      operationId: papers_retrieve
      description: |-
        Mock papers the institute has held.

        **Ordered by `held_on` descending** — most recent first, from
        `TestPaper.Meta.ordering`. The first element is therefore the paper
        `/api/dashboard/summary/` reports `batch_mock_avg` for, which is what
        lets the console label the KPI without a second request.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this test paper.
        required: true
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      tags:
      - papers
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestPaper'
          description: ''
  /api/students/:
    get:
      operationId: students_list
      description: 'The triage table: one row per student, worst risk first.'
      parameters:
      - in: query
        name: active
        schema:
          type: boolean
        description: Only students who have not left (`exited_at` is null).
      - in: query
        name: at_risk
        schema:
          type: boolean
        description: Only students whose `risk_score` is at or above 0.55, the console's
          at-risk threshold. Students with no score yet are excluded — an unscored
          student is unmeasured, not safe.
      - in: query
        name: batch
        schema:
          type: integer
        description: Only students in this batch.
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -mock_avg
          - -mock_trend
          - -name
          - -open_flags
          - -risk_score
          - -roll_no
          - mock_avg
          - mock_trend
          - name
          - open_flags
          - risk_score
          - roll_no
        description: 'Sort column, `-` for descending, comma-separated for tie-breakers.
          Unknown fields are ignored. Default: `-risk_score,name`. `name` is always
          appended as a final tie-break so paging is stable.'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Case-insensitive substring match on `name` or `roll_no`. Ignored
          when blank.
      tags:
      - students
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStudentListList'
          description: ''
  /api/students/{id}/:
    get:
      operationId: students_retrieve
      description: |-
        Students and their derived state — the director's triage surface.

        The list route is the triage table; the `@action` routes below are
        Student 360's panels. Every one of them is scoped to the caller's
        institute and every one of them is paginated (see
        `apps/api/pagination.py` for why that is uniform rather than
        convenient).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this student.
        required: true
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      tags:
      - students
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentDetail'
          description: ''
  /api/students/{id}/attempts/:
    get:
      operationId: students_attempts_list
      description: |-
        Raw attempts for one student, ordered by `question_id`.

        This used to slice at 400 rows and say nothing about it. The seed
        averages ~490 attempts per student, so an unfiltered call was
        already losing about a fifth of them silently — the response had
        no field that could have told anyone. It is paginated now:
        `count` is the true total and `next` is populated when there is
        more.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this student.
        required: true
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: paper
        schema:
          type: integer
        description: Only attempts recorded against this `TestPaper.id`. Omit it and
          you get practice attempts too — which on the seeded data is ~490 rows per
          student, so page through the envelope rather than assuming one page.
      tags:
      - students
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAttemptList'
          description: ''
  /api/students/{id}/diagnosis/:
    get:
      operationId: students_diagnosis_retrieve
      description: |-
        What this student actually misunderstands — the product's core claim.

        Deterministic code counts which distractors were chosen and what each
        cost. The model does the part that is genuinely judgement: whether
        this is a systematic misconception or scattered carelessness, and
        what the *correct* answers reveal about where the error starts.

        Fails loudly rather than degrading to generic advice. A model told
        only "got Q17 wrong, topic Rotational Motion" returns "revise
        Rotational Motion" — worse than an honest error, because it looks
        like an answer.
      parameters:
      - in: query
        name: force
        schema:
          type: boolean
        description: Bypass the cache and re-reason.
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this student.
        required: true
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      - in: query
        name: paper
        schema:
          type: integer
        description: Restrict to one paper.
      tags:
      - reasoning
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Diagnosis'
          description: ''
        '422':
          description: Nothing to diagnose — see detail
        '503':
          description: Reasoning layer unavailable
  /api/students/{id}/diagnosis/verdict/:
    post:
      operationId: students_diagnosis_verdict_create
      description: |-
        Record whether the mentor agreed — this is how training data is made.

        Model output alone is a guess. The same output with a teacher's
        judgement attached is a labelled example, and a corpus of those is
        what we eventually fine-tune our own model on.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this student.
        required: true
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      tags:
      - reasoning
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiagnosisVerdictRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DiagnosisVerdictRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DiagnosisVerdictRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Diagnosis'
          description: ''
  /api/students/{id}/marks-lost/:
    get:
      operationId: students_marks_lost_retrieve
      description: |-
        Partition lost marks by cause for one paper.

        The attribution itself lives in
        `apps.events.services.mock_analysis` — it is an engine, not a
        view, and it is called by the planner and the narration layer too.
      parameters:
      - in: query
        name: detail
        schema:
          type: boolean
        description: Include the per-question cause breakdown.
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this student.
        required: true
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      - in: query
        name: paper
        schema:
          type: integer
        description: The `TestPaper.id` to attribute. Non-numeric or missing values
          are a 400, not an empty result.
        required: true
      tags:
      - students
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarksLost'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/students/{id}/mock-scores/:
    get:
      operationId: students_mock_scores_list
      description: |-
        Per-subject totals for every paper this student sat.

        **Ordered by `held_on` ascending** — oldest paper first. The view
        always did this; the contract did not say so
        (`web/src/api/gaps.ts: MOCK_SCORES_ORDER`), which left the trend
        chart re-sorting defensively on arrival. It is a guarantee now:
        the payload is chart-ready in the order given, left to right.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this student.
        required: true
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - students
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMockScoreList'
          description: ''
  /api/students/{id}/subject-breakdown/:
    get:
      operationId: students_subject_breakdown_list
      description: |-
        Study-time share vs marks-lost share. The neglect chart.

        Always exactly three rows, in the fixed order Physics, Chemistry,
        Maths — a subject with no data comes back as zeroes rather than
        being omitted, so the chart's three bars never renumber
        themselves between students.

        `marks_lost_share_pct` is now a share of **marks**, computed by
        `features.marks_lost_by_topic`. It previously counted lost
        *questions*, which priced a wrong answer and a skipped one
        identically despite the negative marking, and so understated
        exactly the subject a student was guessing through. Same field,
        same units claimed, finally the units delivered — and the same
        function the `subject_imbalance` detector reads, so the flag and
        this chart can no longer disagree.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this student.
        required: true
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - students
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSubjectBreakdownList'
          description: ''
  /api/students/{id}/topic-states/:
    get:
      operationId: students_topic_states_list
      description: |-
        This student's per-chapter mastery, weakest first.

        Ordered by `mastery` ascending; Postgres sorts NULLs last on an
        ascending sort, so chapters with too little evidence to score sit
        at the end rather than masquerading as the weakest ones.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this student.
        required: true
      - in: query
        name: institute
        schema:
          type: integer
        description: 'Superusers only: the institute to scope this call to. Ignored
          for mentor and student accounts, whose institute comes from the account
          itself. A superuser who omits it gets an empty result rather than every
          tenant''s rows.'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: weak
        schema:
          type: boolean
        description: Only chapters with a measured `mastery` below 0.5. Chapters below
          the evidence floor carry a null mastery and are excluded, because 'not enough
          attempts to say' is not the same claim as 'weak'.
      tags:
      - students
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTopicStateList'
          description: ''
components:
  schemas:
    Attempt:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        question_id:
          type: string
          maxLength: 100
        topic_name:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/StatusEnum'
        time_spent:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        marks:
          type: number
          format: double
        source:
          $ref: '#/components/schemas/SourceEnum'
        ts:
          type: string
          format: date-time
      required:
      - id
      - question_id
      - status
      - topic_name
      - ts
    Batch:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        exam_code:
          type: string
          readOnly: true
        year:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        exam_date:
          type: string
          format: date
          nullable: true
        student_count:
          type: integer
          readOnly: true
          nullable: true
          description: Students in this batch. Null when the batch is embedded in
            another payload (e.g. `StudentDetail.batch`), where it is not computed.
      required:
      - exam_code
      - id
      - name
      - student_count
      - year
    BlankEnum:
      enum:
      - ''
    CauseEnum:
      enum:
      - conceptual_gap
      - execution_error
      - time_exhaustion
      - avoidable_skip
      - insufficient_evidence
      type: string
      description: |-
        * `conceptual_gap` - conceptual_gap
        * `execution_error` - execution_error
        * `time_exhaustion` - time_exhaustion
        * `avoidable_skip` - avoidable_skip
        * `insufficient_evidence` - insufficient_evidence
    ConfidenceEnum:
      enum:
      - high
      - medium
      - low
      type: string
      description: |-
        * `high` - high
        * `medium` - medium
        * `low` - low
    DashboardSummary:
      type: object
      description: |-
        Director's KPI strip.

        Two fields here changed *meaning* in v0.2 and the frontend must know:

        `batch_mock_avg` was a SUM of every mark every student ever scored on
        every paper, labelled as an average. It is now the mean total per
        student on the latest paper — which is what the label always claimed,
        and is also 12x cheaper because it stops reading the institute's
        entire history on every dashboard load.

        `revision_debt_pct` divided a sum of per-student debts by a student
        count and called the result a percentage; it could exceed 100 freely.
        It is now the genuine share of scheduled revisions that are overdue.
        The old quantity survives as `avg_revision_debt`, correctly named.
      properties:
        batch_id:
          type: integer
          nullable: true
          description: The batch every KPI below is scoped to, echoed back from `?batch=`.
            Null means the whole institute. It is echoed rather than assumed so a
            console can tell 'the server honoured my filter' from 'the server ignored
            it' — which is exactly the state this endpoint was in before `?batch=`
            existed.
        batch_name:
          type: string
          nullable: true
          description: Display name for `batch_id`. Null when unscoped.
        total_students:
          type: integer
        active_students:
          type: integer
        flagged_this_week:
          type: integer
        critical_flags:
          type: integer
        batch_mock_avg:
          type: number
          format: double
          nullable: true
          description: Mean total marks per student on the most recent paper — out
            of `latest_paper_max_marks`, over `latest_paper_students` sitters. Null
            when nobody in scope sat it, which is the honest answer rather than 0.
        latest_paper_id:
          type: integer
          nullable: true
          description: 'The institute''s most recent paper by `held_on`. Stays institute-wide
            even under `?batch=`: the batch narrows who is counted, not which paper
            is reported.'
        latest_paper_name:
          type: string
          nullable: true
        latest_paper_held_on:
          type: string
          format: date
          nullable: true
        latest_paper_max_marks:
          type: integer
          nullable: true
          description: The denominator for `batch_mock_avg`.
        latest_paper_students:
          type: integer
          description: How many students in scope sat the paper `batch_mock_avg` is
            computed over. 0 with a non-null `latest_paper_id` means this batch did
            not sit the institute's latest mock.
        revision_debt_pct:
          type: number
          format: double
          description: Share of scheduled revisions now past due and not done.
        avg_revision_debt:
          type: number
          format: double
          description: Mean overdue revision cycles per student.
        flags_resolved:
          type: integer
        recovery_rate_pct:
          type: number
          format: double
          nullable: true
          description: Share of closed flags whose outcome was 'recovered'.
      required:
      - active_students
      - avg_revision_debt
      - batch_id
      - batch_mock_avg
      - batch_name
      - critical_flags
      - flagged_this_week
      - flags_resolved
      - latest_paper_held_on
      - latest_paper_id
      - latest_paper_max_marks
      - latest_paper_name
      - latest_paper_students
      - recovery_rate_pct
      - revision_debt_pct
      - total_students
    Detail:
      type: object
      description: The one-key error/ack envelope DRF already uses everywhere.
      properties:
        detail:
          type: string
      required:
      - detail
    Diagnosis:
      type: object
      description: |-
        The output of `diagnose_misconception` — the product's core claim.

        `pattern_found=False` is a real and useful answer. Scattered carelessness
        is a different problem from a systematic misconception and needs a
        different response, so the model is allowed to say so rather than being
        pushed into inventing a pattern.
      properties:
        headline:
          type: string
        pattern_found:
          type: boolean
        hypotheses:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosisHypothesis'
        recommended_action:
          type: string
        time_to_fix:
          allOf:
          - $ref: '#/components/schemas/TimeToFixEnum'
          description: |-
            How much teaching time this costs, as one of four bands. Bounded rather than free text because the model, asked for minutes, returned 40 / 20 / 45 for the same student and the same evidence while its recommended action stayed stable — false precision on a genuinely fuzzy judgement. minutes = a correction at the board · one_session = one focused sitting · several_sessions = a few sittings over a week or two · term_long = a foundational gap needing sustained work. The client supplies the display label.

            * `minutes` - minutes
            * `one_session` - one_session
            * `several_sessions` - several_sessions
            * `term_long` - term_long
        trace_id:
          type: integer
          description: Feed back agreement/disagreement against this id.
        from_cache:
          type: boolean
          description: True if replayed rather than freshly generated.
        human_verdict:
          type: string
      required:
      - from_cache
      - headline
      - human_verdict
      - hypotheses
      - pattern_found
      - recommended_action
      - time_to_fix
      - trace_id
    DiagnosisHypothesis:
      type: object
      properties:
        misconception_code:
          type: string
        claim:
          type: string
        confidence:
          $ref: '#/components/schemas/ConfidenceEnum'
        evidence_questions:
          type: array
          items:
            type: string
        counter_evidence:
          type: string
        marks_at_stake:
          type: integer
      required:
      - claim
      - confidence
      - counter_evidence
      - evidence_questions
      - marks_at_stake
      - misconception_code
    DiagnosisVerdictRequest:
      type: object
      description: |-
        A mentor agreeing or disagreeing. This is what creates training data.

        Raw model output is a guess. The same output with a teacher's verdict
        attached is a labelled example — and a corpus of those is the thing a
        competitor cannot obtain by buying an API key.
      properties:
        verdict:
          $ref: '#/components/schemas/VerdictEnum'
        note:
          type: string
      required:
      - verdict
    Flag:
      type: object
      description: |-
        One detector output, evidenced and routable.

        Filterable by `?open=`, `?severity=`, `?student=` and `?mentor=`;
        ordered by `raised_at` descending.
      properties:
        id:
          type: integer
          readOnly: true
        student_id:
          type: integer
          readOnly: true
        student_name:
          type: string
          readOnly: true
        batch_name:
          type: string
          readOnly: true
        mentor_name:
          type: string
          readOnly: true
        topic_name:
          type: string
          readOnly: true
        type:
          type: string
          description: 'Detector identifier — `weak_topic`, `over_attempting`, `plateau`,
            `subject_imbalance`, `confidence_mismatch`, `revision_overdue`, `disengagement`,
            `overload`, `mock_decline`. Open-ended on purpose: detectors are added
            without a migration, so a client must render an unknown type rather than
            assume a closed set.'
          maxLength: 40
        severity:
          allOf:
          - $ref: '#/components/schemas/SeverityEnum'
          description: |-
            How hard this flag argues for attention. **Graded per detector, not from `risk_score`** — the two answer different questions, and a student can carry a critical flag on one chapter while scoring low overall risk.

            Each detector states its own cut-offs in the units it measures, so they are comparable within a type and only roughly comparable across types. The shape is consistent:
            - `critical` — act this week. e.g. `subject_imbalance` at >= 50 marks *and* >= 10% of the paper at stake; `plateau` at a 30-point gap; `disengagement` at 14 silent days.
            - `high` — act this cycle. The same measures at roughly two-thirds of the critical cut-off (30 marks / 6%, 24 points, 7 silent days).
            - `watch` — the rule fired but below those bars. Evidence, not an instruction.
            - `improving` — the condition is resolving on its own. Deliberately not silence: a mentor should see that what they did worked.

            `evidence` carries whatever that detector measured, and `rule_version` is what lets the grading be re-derived after the thresholds change.

            * `watch` - Watch
            * `high` - High
            * `critical` - Critical
            * `improving` - Improving
        headline:
          type: string
          maxLength: 300
        evidence:
          description: What this detector measured, in its own keys. Shape varies
            by `type` — it is what answers 'why was this flagged?' six months later,
            read together with `rule_version`.
        rule_version:
          type: string
          maxLength: 20
        raised_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
        outcome:
          oneOf:
          - $ref: '#/components/schemas/FlagOutcomeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        is_open:
          type: boolean
          readOnly: true
          description: '`resolved_at is null`. The same set `?open=true` returns.'
      required:
      - batch_name
      - headline
      - id
      - is_open
      - mentor_name
      - raised_at
      - severity
      - student_id
      - student_name
      - topic_name
      - type
    FlagOutcomeEnum:
      enum:
      - recovered
      - declined
      - unknown
      type: string
      description: |-
        * `recovered` - Recovered
        * `declined` - Declined
        * `unknown` - Unknown
    FlagResolveOutcomeEnum:
      enum:
      - recovered
      - declined
      - unknown
      type: string
      description: |-
        * `recovered` - recovered
        * `declined` - declined
        * `unknown` - unknown
    FlagResolveRequest:
      type: object
      description: |-
        Closing a flag. `outcome` is required, on purpose.

        Every resolved flag is a labelled training example for the eventual
        risk model — "given this student's state in month 3, did they recover?"
        Defaulting the field would fill that dataset with polite blanks, so the
        mentor has to say which way it went. `declined` is a perfectly good
        answer and more useful than silence.
      properties:
