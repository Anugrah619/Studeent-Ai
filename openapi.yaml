          type: string
          format: date
        summary:
          type: string
          description: Two or three sentences, built from the blocks' own reasons.
        available:
          type: boolean
          description: True if `summary` was written by the model. False means it
            is the fixed summary — because the model is unavailable, the budget is
            spent, or there is no plan for the day. Never an error.
        from_cache:
          type: boolean
          description: True if this exact plan was explained before and the answer
            replayed.
      required:
      - available
      - date
      - from_cache
      - summary
    PlanExplainDayRequest:
      type: object
      properties:
        date:
          type: string
          format: date
          description: The day whose plan to explain, `YYYY-MM-DD`. Defaults to today.
    PlanGenerateRequestRequest:
      type: object
      properties:
        date:
          type: string
          format: date
          description: 'The day to plan, `YYYY-MM-DD`: today (the default) up to a
            week ahead. Further out, the state the plan is built from will have moved.'
        replace:
          type: boolean
          default: false
          description: Rebuild a plan that already exists. Only blocks not yet ticked
            are replaced; anything completed stays. Without it, an existing plan is
            returned as it is.
    PlanGeneration:
      type: object
      properties:
        date:
          type: string
          format: date
        generated:
          type: boolean
          description: 'True if this call made blocks. False if the plan already existed,
            or if nothing qualifies yet — `blocks` then says which: empty means there
            was nothing to plan, not that the call failed.'
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/PlanBlock'
        note:
          type: string
          nullable: true
          description: One gentle sentence when today's plan is deliberately lighter
            or shorter than usual — written for the student, safe to show as it is,
            and never naming why. Null on an ordinary day (and on an empty one). Always
            present.
      required:
      - blocks
      - date
      - generated
      - note
    ProposedByEnum:
      enum:
      - model
      - console
      type: string
      description: |-
        * `model` - The question factory's tagger
        * `console` - A person, in the console
    QuestionDetail:
      type: object
      description: |-
        One question, in full — what a director sees on clicking an evidence chip.

        This is the endpoint that closes the loop the diagnosis card opens.
        A finding cites `D16`; clicking it has to show the actual question,
        the option the student reached for, and what reaching for it means.
        Without that the evidence is an assertion the reader has no way to
        check, and checkability is the entire argument for tagging distractors.

        With `?student=`, three fields at the bottom and `options[].chosen`
        describe what that one student did here. Without it the question comes
        back on its own, which is what a client wants when it is showing the
        paper rather than a person.
      properties:
        id:
          type: integer
          readOnly: true
        label:
          type: string
          readOnly: true
          description: The question as the paper prints it — `"D16"`. Unique within
            a paper, **not** across papers, which is why `id` and not this is what
            `DiagnosisEvidence.question_id` carries. Stored as `QuestionTopicMap.question_id`.
        paper_id:
          type: integer
          readOnly: true
        paper_name:
          type: string
          readOnly: true
        topic:
          type: string
          readOnly: true
          nullable: true
          description: Chapter. Null on a question nobody has mapped yet.
        subject:
          type: string
          nullable: true
          readOnly: true
        difficulty:
          oneOf:
          - $ref: '#/components/schemas/DifficultyEnum'
          - $ref: '#/components/schemas/BlankEnum'
        question_text:
          type: string
        solution:
          type: string
          description: The worked method, not just the final answer.
        options:
          type: array
          items:
            $ref: '#/components/schemas/QuestionOption'
          readOnly: true
        student_id:
          type: integer
          readOnly: true
          nullable: true
          description: Echo of `?student=`. Null when the question was fetched on
            its own.
        chosen_label:
          type: string
          readOnly: true
          nullable: true
          description: The option letter this student picked. Null when `?student=`
            was not given, and also when it was but the student left this question
            blank or never reached it — `status` distinguishes those.
        status:
          readOnly: true
          nullable: true
          description: |-
            What became of this question for this student. A closed set, because `blank` and `not_reached` are the distinction the whole marks-lost taxonomy rests on — choosing to skip and running out of time need opposite advice. Null when `?student=` was not given, or when this student has no attempt recorded here.

            * `correct` - Correct
            * `wrong` - Wrong
            * `blank` - Skipped deliberately
            * `not_reached` - Ran out of time
          oneOf:
          - $ref: '#/components/schemas/StatusEnum'
          - $ref: '#/components/schemas/NullEnum'
        marks:
          type: number
          format: double
          readOnly: true
          nullable: true
          description: Marks scored on this question after negative marking. Null
            as above.
        time_spent:
          type: integer
          readOnly: true
          nullable: true
          description: Seconds spent. Often genuinely absent even when the attempt
            exists.
        source:
          $ref: '#/components/schemas/PaperSourceEnum'
        source_ref:
          type: string
          maxLength: 160
      required:
      - chosen_label
      - id
      - label
      - marks
      - options
      - paper_id
      - paper_name
      - status
      - student_id
      - subject
      - time_spent
      - topic
    QuestionOption:
      type: object
      description: |-
        One lettered option, and what choosing it would reveal.

        `misconception` is populated on wrong options that have been
        explained, which is the whole reason this endpoint is worth opening:
        it answers *why the wrong option was tempting*, not just that it was
        wrong. A wrong option with a null misconception is a gap in the
        taxonomy rather than a bug — it simply cannot contribute to a
        diagnosis.
      properties:
        label:
          type: string
          maxLength: 2
        text:
          type: string
          maxLength: 500
        is_correct:
          type: boolean
        chosen:
          type: boolean
          readOnly: true
          nullable: true
          description: Whether the student named by `?student=` picked this option.
            **Null on every option when `?student=` was not given** — null is 'not
            asked', which is a different thing from `false`, and a client that renders
            null as 'not chosen' will show a question where the student appears to
            have answered nothing.
        misconception:
          allOf:
          - $ref: '#/components/schemas/Misconception'
          readOnly: true
          nullable: true
          description: The wrong belief that produces this option. Always null on
            the correct option, and null on wrong options nobody has explained yet.
      required:
      - chosen
      - label
      - misconception
      - text
    ResultsReport:
      type: object
      description: |-
        What happened to a results file — every student accounted for.

        A student is ingested completely or not at all, so
        `students_ingested + students_already_recorded + students_failed` is
        `students_in_file`, with nobody half-counted.
      properties:
        dry_run:
          type: boolean
        ok:
          type: boolean
          description: A real run would write something (or has nothing left to).
        paper_id:
          type: integer
        layout:
          type: string
          description: '`wide` (a column per question) or `long` (a row per answer).'
        batch_id:
          type: integer
          nullable: true
        students_in_file:
          type: integer
        students_ingested:
          type: integer
        students_already_recorded:
          type: integer
          description: Every answer in their row was already on file. Counted, not
            doubled.
        students_failed:
          type: integer
        attempts_created:
          type: integer
        attempts_already_recorded:
          type: integer
        unmapped_questions:
          type: array
          items:
            type: string
          description: Questions in the file the paper's blueprint does not know.
            Non-empty means nothing was written.
        unkeyed_questions:
          type: array
          items:
            type: string
          description: Questions with no answer key. Non-empty means nothing was written.
        ignored_columns:
          type: array
          items:
            type: string
        questions_not_in_file:
          type: array
          items:
            type: string
          description: 'Paper questions the file does not cover. A warning: a partial
            sitting is real.'
        duplicate_of_batch:
          type: integer
          nullable: true
          description: 'On a dry run: this exact file was already imported as this
            batch.'
        derived_refreshed:
          type: boolean
          description: Counts were recomputed for the students this file touched.
        flags_raised:
          type: integer
          nullable: true
          description: Flags the detectors raised for those students afterwards.
        errors_total:
          type: integer
        errors:
          type: array
          items:
            $ref: '#/components/schemas/IngestRowError'
          description: At most the first 100.
      required:
      - attempts_already_recorded
      - attempts_created
      - batch_id
      - derived_refreshed
      - dry_run
      - duplicate_of_batch
      - errors
      - errors_total
      - flags_raised
      - ignored_columns
      - layout
      - ok
      - paper_id
      - questions_not_in_file
      - students_already_recorded
      - students_failed
      - students_in_file
      - students_ingested
      - unkeyed_questions
      - unmapped_questions
    ResultsUploadRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: CSV or Excel `.xlsx` (first sheet). Either one row per student
            with a column per question (`roll_no, Q1, Q2, …`), or one row per answer
            (`roll_no, question_id, answer`). Legacy `.xls` is refused with how to
