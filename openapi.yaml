  /api/my/attempts/:
    get:
      operationId: my_attempts_list
      description: |-
        Every answer I have given — the way into reviewing my mistakes.

        Each row carries `question_pk`, which `GET /api/my/questions/{id}/` opens
        onto the question, the correct answer and the worked solution. Ordered by
        paper then question label.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: paper
        schema:
          type: integer
        description: Only answers on this paper (`paper_id` from `mock-scores`).
      - in: query
        name: status
        schema:
          type: string
          enum:
          - blank
          - correct
          - not_reached
          - wrong
        description: Only answers with this outcome — `wrong` is the usual review
          list. `blank` (chose to skip) and `not_reached` (ran out of time) are different
          things.
      tags:
      - student-app
      security:
      - cookieAuth: []
      responses:
