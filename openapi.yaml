    MarksLost:
      type: object
      description: |-
        Mistake taxonomy for one paper — the line that sells the product.

        **BREAKING, v0.3.** A fifth cause, `insufficient_evidence`, and two
        new fields, `attributed_lost` and `recoverable_pct`. `conceptual_gap`
        keeps its name and its type but its *value falls* — by a third across
        the seeded cohort — because it no longer absorbs marks lost on
        chapters whose mastery was never measured.

        The old shape had four buckets partitioning `total_lost`, with
        `recoverable` defined as `total_lost - conceptual_gap`. Every chapter
        held below the four-attempt evidence floor arrived with a null
        mastery, failed the "do they know it" test for the same reason a
        chapter they are genuinely bad at fails it, and was booked as a
        demonstrated conceptual gap. A refusal to claim became a claim.

        A client rendering the taxonomy must give the new bucket its own
        neutral segment. Folding it back into `conceptual_gap` to keep the
        old four-bar chart reinstates the defect in the presentation layer.
      properties:
        paper_id:
          type: integer
        paper_name:
          type: string
        held_on:
          type: string
          format: date
        max_marks:
          type: integer
        questions:
          type: integer
        attempted:
          type: integer
        score:
          type: number
          format: double
        conceptual_gap:
          type: integer
          description: Marks lost where mastery was **measured and low**, plus wrong
            answers on chapters they know that took more than twice their own median
            time. Evidenced failures only.
        execution_error:
          type: integer
        time_exhaustion:
          type: integer
        avoidable_skip:
          type: integer
        insufficient_evidence:
          type: integer
          description: Marks lost on chapters below the four-attempt evidence floor,
            where `TopicState.mastery` is null. **Not a cause.** The action it implies
            is 'practise this chapter so we can tell you', not 'relearn it'.
        total_lost:
          type: integer
          description: '`max_marks - score`. The five cause buckets sum to exactly
            this.'
        attributed_lost:
          type: integer
          description: '`total_lost - insufficient_evidence` — the marks the analysis
            is entitled to explain, and the denominator of `recoverable_pct`.'
        recoverable:
          type: integer
          description: 'Marks lost to causes that need no new learning: `execution_error
            + time_exhaustion + avoidable_skip`. **No longer `total_lost - conceptual_gap`**
            — that identity held only while four buckets partitioned the loss, and
            counting unmeasured chapters as recoverable would be the same unsupported
            claim the fifth bucket exists to stop, pointed the other way.'
        recoverable_pct:
          type: number
          format: double
          nullable: true
          description: '`recoverable / attributed_lost * 100` — the headline share.
            Over attributed marks, not total: a percentage diluted by marks nobody
            can explain is not the claim being made. Null when `attributed_lost` is
            0, which is an honest ''cannot say'' and must not render as 0%.'
        time_baseline_sec:
          type: number
          format: double
          nullable: true
          description: Median seconds this student spends on a question they get right.
            Null when they have fewer than 8 timed correct answers, in which case
            the time rule was not applied.
        causes:
          type: array
          items:
            $ref: '#/components/schemas/MarksLostCause'
        top_loss_topics:
          type: array
          items:
            $ref: '#/components/schemas/LossTopic'
      required:
      - attempted
      - attributed_lost
      - avoidable_skip
      - causes
      - conceptual_gap
      - execution_error
      - held_on
      - insufficient_evidence
      - max_marks
      - paper_id
      - paper_name
      - questions
      - recoverable
      - recoverable_pct
      - score
      - time_baseline_sec
      - time_exhaustion
      - top_loss_topics
      - total_lost
    MarksLostCause:
      type: object
      description: |-
        One row of the mistake taxonomy, chart-ready.

        Five rows now, always, in this order. `insufficient_evidence` was
        added in v0.3 and appended rather than inserted, so a client reading
        `causes[i]` positionally keeps reading the same cause it did before.
      properties:
        cause:
          allOf:
          - $ref: '#/components/schemas/CauseEnum'
          description: |-
            `insufficient_evidence` is **not a diagnosis** — it is the marks lost on chapters whose mastery sits below the four-attempt evidence floor, so no cause can be claimed. Render it in a neutral colour, never in the conceptual-gap red: it previously *was* counted as conceptual gap, which was the defect this bucket exists to fix.

            * `conceptual_gap` - conceptual_gap
            * `execution_error` - execution_error
            * `time_exhaustion` - time_exhaustion
            * `avoidable_skip` - avoidable_skip
            * `insufficient_evidence` - insufficient_evidence
        marks:
          type: integer
        questions:
          type: integer
        share_pct:
          type: number
          format: double
          description: Share of `total_lost`. The five rows sum to 100%.
      required:
      - cause
      - marks
      - questions
      - share_pct
