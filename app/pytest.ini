[pytest]
DJANGO_SETTINGS_MODULE = config.settings
pythonpath = .
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers --tb=short
markers =
    rls: exercises Postgres row-level security through the unprivileged role
    contract: validates a live response against openapi.yaml
    slow: builds a large fixture cohort
filterwarnings =
    ignore::DeprecationWarning
